<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тура 08.11.2026 — Оператива</title><style>
:root{--ink:#18211b;--muted:#6d766f;--line:#e2e7e3;--bg:#f3f5f3;--green:#17633b;--greenbg:#e8f3eb;--red:#a33b25;--amber:#8b5b16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Arial,sans-serif}button,input{font:inherit}.top{background:var(--ink);color:white;padding:18px}.top h1{margin:0;font-size:22px}.top p{margin:4px 0 0;color:#c5cec8;font-size:12px}.wrap{max-width:1100px;margin:auto;padding:14px 18px}.tour{background:white;padding:12px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.muted{font-size:12px;color:var(--muted)}.crumb{padding:12px 0;color:var(--muted);font-size:13px}.crumb button{border:0;background:none;color:var(--green);font-weight:900;font-size:13px}.title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:8px 0 14px}.title h2{margin:0;font-size:23px}.pill{border-radius:30px;padding:6px 11px;background:#edf0ed;font-size:11px;font-weight:900}.ok{background:var(--greenbg);color:var(--green)}.warn{background:#fff4df;color:var(--amber)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.stat,.card{background:white;border:1px solid var(--line);border-radius:14px}.stat{padding:13px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.section{display:flex;justify-content:space-between;margin:18px 0 8px;font-weight:900}.point,.person{padding:16px;margin:9px 0;cursor:pointer}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pname{font-size:17px;font-weight:950}.time{font-size:21px;font-weight:950}.meta{font-size:12px;color:var(--muted);margin-top:4px}.bar{height:7px;background:#edf0ed;border-radius:9px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.person{display:flex;align-items:center;justify-content:space-between}.personleft{display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--greenbg);color:var(--green);font-weight:900}.order{padding:16px;margin:12px 0}.product{padding:13px 0;border-bottom:1px solid var(--line)}.product:last-child{border:0}.prodname{font-weight:950;font-size:15px}.sub{font-size:11px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:minmax(160px,1fr) 150px 150px auto;gap:10px;align-items:end;margin-top:12px}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid #cbd4cc;border-radius:9px;font-size:16px}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:12px 16px;font-size:13px;font-weight:900;cursor:pointer}.primary{background:var(--ink);color:white}.green{background:var(--green);color:white}.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:14px 0;margin-top:10px;font-weight:900}.total strong{font-size:22px}.notice{background:#f7f9f7;padding:12px;border-radius:10px;color:var(--muted);font-size:12px;margin:10px 0}.check{display:flex;gap:10px;align-items:flex-start;background:var(--greenbg);padding:14px;border-radius:11px;margin-top:12px}.check input{width:20px;height:20px}.check b{color:var(--green)}.back{color:var(--green);font-weight:900;margin:5px 0 13px;cursor:pointer}.layer{position:fixed;z-index:10;top:18px;bottom:18px;left:5vw;right:18px;background:var(--bg);border:1px solid #cbd4cc;border-radius:18px;box-shadow:0 18px 60px #101b1444;overflow:auto;padding:0 24px 30px;animation:slide .18s}.layerhead{position:sticky;top:0;background:var(--ink);color:white;margin:0 -24px 16px;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}.layerhead button{background:#ffffff20;border:1px solid #ffffff55;color:white;padding:10px 15px;border-radius:9px;font-weight:900}.layerbody{max-width:1000px;margin:auto}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{background:white;border:1px solid var(--line);border-radius:10px;padding:12px}.tile b{display:block;font-size:13px}.tile span{font-size:11px;color:var(--muted)}.loading,.error{background:white;padding:22px;border-radius:12px;margin:12px 0}.error{color:var(--red)}@keyframes slide{from{transform:translateX(30px);opacity:.7}to{transform:none;opacity:1}}@media(max-width:700px){.wrap{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.layer{inset:0;border:0;border-radius:0;padding:0 13px 24px}.layerhead{margin:0 -13px;padding:12px 13px}.title h2{font-size:19px}.grid{grid-template-columns:1fr 1fr}.grid .btn{grid-column:1/-1}.tiles{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header class="top"><div class="wrap"><h1>Оператива доставе</h1><p>Тура → пунктови → купци → поруџбине → производи</p></div></header>
<div class="tour"><div><b id="tourname">Тура 08.11.2026.</b><div class="muted" id="tourinfo">Учитавање података из базе…</div></div><span class="pill warn" id="dbstate">Повезивање…</span></div>
<main class="wrap"><nav class="crumb" id="crumb">Тура 08.11.2026.</nav><div id="view"><div class="loading">Учитавање туре…</div></div><div class="muted" style="text-align:center;padding:22px">Приказује само туру 08.11.2026. · ID 71</div></main><div id="layers"></div>
<script>
const TOUR=71;let U='',K='',H={};let tour=null,stops=[],points=[],orders=[],customers=[],rows=[],stack=[],pointSel=null,buyerSel=null;
const num=v=>Number(v??0)||0,fmt=v=>Number(num(v).toFixed(2)).toLocaleString('sr-RS'),money=v=>Math.round(num(v)).toLocaleString('sr-RS')+' дин.',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(U+'/rest/v1/'+path,{cache:'no-store',...opt,headers:{...H,...(opt.headers||{})}});const b=await r.text();if(!r.ok)throw Error(b||('HTTP '+r.status));return b?JSON.parse(b):null}
function qty(r){return num(r.kolicina??r.total_quantity)}function size(r){return num(r.package_size)||num(r.velicina_pakovanja)||1}function count(r){return r.package_count!=null?num(r.package_count):(r.broj_pakovanja!=null?num(r.broj_pakovanja):qty(r)/size(r))}function unit(r){return r.package_unit||r.quantity_unit||r.jedinica||'ком'}function unitPrice(r){return r.unit_price!=null?num(r.unit_price):(qty(r)?num(r.cena_stavke)/qty(r):0)}function packPrice(r){return unitPrice(r)*size(r)}function delivered(r){return num(r.isporucena_kolicina)/size(r)}function picked(r){return num(r.preuzeta_kolicina)/size(r)}
function lines(id){return rows.filter(r=>String(r.porudzbina_id)===String(id))}function meta(id){return orders.find(o=>String(o.id)===String(id))||{}}function total(id){return lines(id).reduce((s,r)=>s+qty(r)*unitPrice(r),0)}function done(id){const a=lines(id);return a.length>0&&a.every(r=>num(r.isporucena_kolicina)>=qty(r))}
function buyerFor(id){const o=meta(id),c=customers.find(x=>String(x.id)===String(o.kupac_id)),r=lines(id)[0];return {id:o.kupac_id||'o'+id,name:c?.ime_prezime||r?.recipient_name||o.telefon||'Купац',phone:c?.telefon||o.telefon||''}}
function buyersAt(pid){const m=new Map();orders.filter(o=>String(o.punkt_id||'')===String(pid||'')).forEach(o=>{if(!lines(o.id).length)return;const b=buyerFor(o.id),k=String(b.id);if(!m.has(k))m.set(k,{...b,orders:[]});m.get(k).orders.push(o)});return [...m.values()].sort((a,b)=>a.name.localeCompare(b.name,'sr'))}
function active(){return stack.length?stack[stack.length-1].querySelector('.layerbody'):document.getElementById('view')}
function push(title){const e=document.createElement('section');e.className='layer';e.innerHTML='<div class="layerhead"><b>'+esc(title)+'</b><button onclick="back()">← Назад</button></div><div class="layerbody"></div>';document.getElementById('layers').appendChild(e);stack.push(e)}
function back(){if(!stack.length)return;stack.pop().remove();if(stack.length===2){renderBuyer()}else if(stack.length===1){buyerSel=null;renderPoint()}else{pointSel=null;buyerSel=null;renderRoute()}}
function goHome(){while(stack.length)stack.pop().remove();pointSel=null;buyerSel=null;renderRoute()}
function crumbs(){let s='<button onclick="goHome()">Тура 08.11.2026.</button>';if(pointSel)s+=' › <button onclick="renderPoint()">'+esc(pointSel.name)+'</button>';if(buyerSel)s+=' › <b>'+esc(buyerSel.name)+'</b>';document.getElementById('crumb').innerHTML=s}
function stats(){return {buyers:new Set(orders.map(o=>String(o.kupac_id||'o'+o.id))).size,orders:orders.length,done:orders.filter(o=>done(o.id)).length}}
function renderRoute(){crumbs();const st=stats(),pm=new Map();rows.forEach(r=>{let k=r.proizvod||'Непознат производ';if(!pm.has(k))pm.set(k,{name:k,qty:0,unit:unit(r),lines:0});let x=pm.get(k);x.qty+=qty(r);x.lines++});let prod=[...pm.values()].sort((a,b)=>a.name.localeCompare(b.name,'sr')).map(x=>'<div class="tile"><b>'+esc(x.name)+'</b><span>'+fmt(x.qty)+' '+esc(x.unit)+' · '+x.lines+' ставки</span></div>').join('');
document.getElementById('view').innerHTML='<div class="title"><div><h2>Пунктови на тури</h2><div class="muted">Изабери пункт да видиш купце и њихове производе.</div></div><span class="pill ok">База повезана</span></div><div class="stats"><div class="stat"><b>'+stops.length+'</b><span>пунктова на рути</span></div><div class="stat"><b>'+st.buyers+'</b><span>купаца</span></div><div class="stat"><b>'+st.orders+'</b><span>поруџбина са производима</span></div><div class="stat"><b>'+st.done+'/'+st.orders+'</b><span>достављено</span></div></div><div class="section"><span>Редослед обиласка</span><span class="muted">Време доласка</span></div>'+stops.map((p,i)=>{let bs=buyersAt(p.punkt_id),c=bs.reduce((a,b)=>a+b.orders.length,0),d=bs.reduce((a,b)=>a+b.orders.filter(o=>done(o.id)).length,0),lc=orders.filter(o=>String(o.punkt_id)===String(p.punkt_id)).reduce((a,o)=>a+lines(o.id).length,0);return '<section class="card point" onclick="openPoint('+p.punkt_id+')"><div class="row"><div><div class="pname">'+(i+1)+'. '+esc(p.name)+'</div><div class="meta">'+esc(p.address||p.city||'')+' · '+c+' поруџбина · '+lc+' ставки</div></div><div style="text-align:right"><div class="time">'+esc(p.vreme||'—')+'</div><span class="pill '+(c&&d===c?'ok':'warn')+'">'+d+'/'+c+' достављено</span></div></div><div class="bar"><i style="width:'+(c?d/c*100:0)+'%"></i></div></section>'}).join('')+(orders.some(o=>!o.punkt_id)?'<div class="section">Поруџбине без пункта</div><section class="card point" onclick="openPoint(0)"><b>Без додељеног пункта</b><div class="meta">'+orders.filter(o=>!o.punkt_id).length+' поруџбина</div></section>':'')+'<div class="section">Производи у овој тури <span class="muted">'+rows.length+' ставки</span></div><div class="tiles">'+prod+'</div>'}
function openPoint(id){pointSel=id?points.find(p=>String(p.id)===String(id)):{id:null,name:'Без пункта',address:'Поруџбине без додељеног пункта'};if(!pointSel)return;buyerSel=null;push(pointSel.name);renderPoint()}
function renderPoint(){crumbs();let bs=pointSel.id?buyersAt(pointSel.id):orders.filter(o=>!o.punkt_id).map(o=>({...buyerFor(o.id),orders:[o]})),all=bs.reduce((s,b)=>s+b.orders.length,0),d=bs.reduce((s,b)=>s+b.orders.filter(o=>done(o.id)).length,0);active().innerHTML='<div class="back" onclick="back()">← Назад на пунктове</div><div class="title"><div><h2>'+esc(pointSel.name)+'</h2><div class="muted">'+esc(pointSel.address||'')+' · '+esc(stops.find(p=>String(p.punkt_id)===String(pointSel.id))?.vreme||'без сатнице')+'</div></div><span class="pill '+(all&&d===all?'ok':'warn')+'">'+d+'/'+all+' достављено</span></div><div class="stats"><div class="stat"><b>'+bs.length+'</b><span>купаца</span></div><div class="stat"><b>'+all+'</b><span>поруџбина</span></div><div class="stat"><b>'+bs.reduce((s,b)=>s+b.orders.reduce((a,o)=>a+lines(o.id).length,0),0)+'</b><span>ставки производа</span></div><div class="stat"><b>'+d+'</b><span>достављено</span></div></div><div class="section">Купци на пункту <span class="muted">Отвори купца →</span></div>'+bs.map(b=>{let doneN=b.orders.filter(o=>done(o.id)).length,amt=b.orders.reduce((s,o)=>s+total(o.id),0);return '<section class="card person" onclick="openBuyerByOrder('+b.orders[0].id+')"><div class="personleft"><div class="avatar">'+esc(b.name.trim().split(' ').map(x=>x[0]).slice(0,2).join(''))+'</div><div><div class="pname">'+esc(b.name)+'</div><div class="meta">'+esc(b.phone)+' · '+b.orders.length+' поруџбина · '+money(amt)+'</div></div></div><span class="pill '+(doneN===b.orders.length?'ok':'warn')+'">'+doneN+'/'+b.orders.length+' готово</span></section>'}).join('')+(bs.length?'':'<div class="loading">Нема купаца са производима на овом пункту.</div>')}
function openBuyerByOrder(orderId){let bs=pointSel.id?buyersAt(pointSel.id):orders.filter(o=>!o.punkt_id).map(o=>({...buyerFor(o.id),orders:[o]}));buyerSel=bs.find(b=>b.orders.some(o=>String(o.id)===String(orderId)));if(!buyerSel)return;push(buyerSel.name);renderBuyer()}
function openBuyer(id){let bs=pointSel.id?buyersAt(pointSel.id):orders.filter(o=>!o.punkt_id).map(o=>({...buyerFor(o.id),orders:[o]}));buyerSel=bs.find(b=>String(b.id)===String(id));if(!buyerSel)return;push(buyerSel.name);renderBuyer()}
function renderBuyer(){crumbs();active().innerHTML='<div class="back" onclick="back()">← Назад на списак купаца</div><div class="title"><div><h2>'+esc(buyerSel.name)+'</h2><div class="muted">'+esc(buyerSel.phone)+' · '+esc(pointSel.name)+'</div></div><span class="pill">'+buyerSel.orders.length+' поруџбина</span></div>'+buyerSel.orders.map(o=>'<section class="card order"><div class="row"><div><b>Поруџбина #'+o.id+'</b><div class="meta">'+lines(o.id).length+' производа</div></div><span class="pill '+(done(o.id)?'ok':'warn')+'">'+(done(o.id)?'Достављено':'За доставу')+'</span></div>'+lines(o.id).map(r=>'<div class="product"><div class="row"><div><div class="prodname">'+esc(r.proizvod)+'</div><div class="sub">'+esc(r.variant_name||fmt(size(r))+' '+unit(r))+' · '+fmt(count(r))+' паковања · достављено '+fmt(delivered(r))+' пак.</div></div><b>'+money(qty(r)*unitPrice(r))+'</b></div></div>').join('')+'<div class="total"><span>Укупно</span><strong>'+money(total(o.id))+'</strong></div><button class="btn primary" onclick="openOrder('+o.id+')">Отвори поруџбину</button></section>').join('')}
function openOrder(id){push('ПОРУЏБИНА #'+id);renderOrder(id)}
function renderOrder(id){crumbs();let o=meta(id),rs=lines(id);active().innerHTML='<div class="back" onclick="back()">← Назад на купца</div><div class="title"><div><h2>Поруџбина #'+id+'</h2><div class="muted">'+esc(buyerSel.name)+' · '+esc(buyerSel.phone)+'</div></div><span class="pill '+(done(id)?'ok':'warn')+'">'+(done(id)?'Достављено':'За доставу')+'</span></div><div class="notice">Количину мењаш бројем паковања. Систем сам прерачунава основну количину и износ. Преузимање од добављача и достава купцу су одвојени подаци.</div><section class="card order"><b>Производи</b>'+rs.map(r=>'<div class="product"><div class="row"><div><div class="prodname">'+esc(r.proizvod)+'</div><div class="sub">'+esc(r.variant_name||fmt(size(r))+' '+unit(r))+' · преузето '+fmt(picked(r))+' паковања</div></div><span class="pill '+(num(r.preuzeta_kolicina)>=qty(r)?'ok':'warn')+'">'+(num(r.preuzeta_kolicina)>=qty(r)?'Преузето':'Недостаје')+'</span></div><div class="grid"><div class="field"><label>БРОЈ ПАКОВАЊА</label><input id="cnt-'+r.id+'" type="number" min="0" step="0.5" value="'+String(count(r))+'"></div><div class="field"><label>ЦЕНА ПО ПАКОВАЊУ</label><input id="prc-'+r.id+'" type="number" min="0" step="1" value="'+String(packPrice(r))+'"></div><div><b>'+money(qty(r)*unitPrice(r))+'</b></div><button class="btn primary" id="sv-'+r.id+'" onclick="saveLine('+r.id+')">Сачувај</button></div><div class="grid" style="grid-template-columns:1fr 150px auto"><div class="field"><label>ДОСТАВЉЕНО ПАКОВАЊА</label><input id="dlv-'+r.id+'" type="number" min="0" max="'+String(count(r))+'" step="0.5" value="'+String(delivered(r))+'"></div><div class="sub">'+fmt(num(r.isporucena_kolicina))+' '+esc(unit(r))+' укупно</div><button class="btn" onclick="saveDelivered('+r.id+')">Сачувај доставу</button></div></div>').join('')+'<div class="total"><span>Укупно за наплату</span><strong>'+money(total(id))+'</strong></div></section><section class="card order"><b>Завршетак доставе</b><div class="notice">Потврда означава све производе у овој поруџбини као достављене у тренутној количини.</div><label class="check"><input type="checkbox" '+(done(id)?'checked':'')+' onchange="finishOrder('+id+',this.checked)"><span><b>Потврди да је цела поруџбина достављена купцу</b><div class="sub">Поруџбина ће бити означена као достављена.</div></span></label></section>'}
async function saveLine(id){let r=rows.find(x=>String(x.id)===String(id));if(!r)return;let c=Number(document.getElementById('cnt-'+id).value),p=Number(document.getElementById('prc-'+id).value),sz=size(r);if(!Number.isFinite(c)||c<0||!Number.isFinite(p)||p<0){alert('Унеси исправан број паковања и цену.');return}let btn=document.getElementById('sv-'+id);btn.disabled=true;btn.textContent='Чувам…';let qNew=c*sz,unitP=p/sz;try{await api('stavke_porudzbine?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({kolicina:qNew,total_quantity:qNew,package_count:c,broj_pakovanja:c,unit_price:unitP,cena_stavke:c*p,isporucena_kolicina:Math.min(num(r.isporucena_kolicina),qNew),preuzeta_kolicina:Math.min(num(r.preuzeta_kolicina),qNew)})});await updateTotal(r.porudzbina_id);await loadData();renderOrder(r.porudzbina_id)}catch(e){btn.disabled=false;btn.textContent='Сачувај';alert('Није сачувано: '+e.message)}}
async function saveDelivered(id){let r=rows.find(x=>String(x.id)===String(id));if(!r)return;let c=Number(document.getElementById('dlv-'+id).value);if(!Number.isFinite(c)||c<0||c>count(r)){alert('Количина достављених паковања није исправна.');return}try{await api('stavke_porudzbine?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({isporucena_kolicina:c*size(r)})});await loadData();renderOrder(r.porudzbina_id)}catch(e){alert('Није сачувано: '+e.message)}}
async function finishOrder(id,yes){if(yes&&!confirm('Потврђујеш да је цела поруџбина #'+id+' достављена?')){renderOrder(id);return}try{for(let r of lines(id))await api('stavke_porudzbine?id=eq.'+r.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({isporucena_kolicina:yes?qty(r):0})});await api('porudzbine?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({dostava_obradjena:yes,dostava_obradjena_at:yes?new Date().toISOString():null,updated_at:new Date().toISOString()})});await loadData();renderOrder(id)}catch(e){alert('Потврда доставе није сачувана: '+e.message);await loadData();renderOrder(id)}}
async function updateTotal(id){let a=await api('stavke_porudzbine?select=kolicina,total_quantity,unit_price,cena_stavke&porudzbina_id=eq.'+id);let sum=(a||[]).reduce((s,r)=>{let q=num(r.kolicina??r.total_quantity),p=r.unit_price!=null?num(r.unit_price):(q?num(r.cena_stavke)/q:0);return s+q*p},0);await api('porudzbine?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({ukupna_cena:sum,updated_at:new Date().toISOString()})})}
async function loadData(){let t=await api('ture?select=id,naziv,datum,status&id=eq.'+TOUR);if(!t?.length)throw Error('Тура 08.11.2026. није пронађена.');tour=t[0];stops=await api('tura_punktovi?select=tura_id,punkt_id,redosled,aktivan,vreme&tura_id=eq.'+TOUR+'&aktivan=eq.true');let pids=[...new Set(stops.map(x=>String(x.punkt_id)))];points=pids.length?await api('punktovi?select=id,name,city,address&id=in.('+pids.join(',')+')'):[];rows=await api('stavke_porudzbine?select=id,porudzbina_id,proizvod,kolicina,total_quantity,jedinica,quantity_unit,unit_price,cena_stavke,package_count,broj_pakovanja,package_size,package_unit,velicina_pakovanja,variant_name,preuzeta_kolicina,isporucena_kolicina,recipient_name,tura_id&tura_id=eq.'+TOUR+'&order=id.asc');let oids=[...new Set(rows.map(x=>String(x.porudzbina_id)).filter(Boolean))];orders=oids.length?await api('porudzbine?select=id,kupac_id,punkt_id,status,ukupna_cena,naplaceno,telefon,dostava_obradjena,dostava_obradjena_at&id=in.('+oids.join(',')+')'):[];let cids=[...new Set(orders.map(x=>String(x.kupac_id)).filter(Boolean))];customers=cids.length?await api('kupci?select=id,ime_prezime,telefon&id=in.('+cids.join(',')+')'):[];stops.sort((a,b)=>String(a.vreme||'99:99').localeCompare(String(b.vreme||'99:99'))||num(a.redosled)-num(b.redosled));document.getElementById('tourname').textContent=tour.naziv;document.getElementById('tourinfo').textContent=new Date(tour.datum+'T00:00:00').toLocaleDateString('sr-RS')+' · '+rows.length+' ставки у бази';document.getElementById('dbstate').textContent='Повезано са базом';document.getElementById('dbstate').className='pill ok';renderRoute()}
async function init(){try{let main=await fetch('/operativa-v2.html',{cache:'no-store'}),txt=await main.text(),m=txt.match(/const U='([^']+)',K='([^']+)'/);if(!m)throw Error('Не могу да прочитам постојећу конфигурацију базе из оперативе.');U=m[1];K=m[2];H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};await loadData()}catch(e){document.getElementById('dbstate').textContent='Грешка';document.getElementById('dbstate').className='pill';document.getElementById('view').innerHTML='<div class="error">Нисам успео да учитам податке: '+esc(e.message)+'</div>'}}
init();
</script></body></html>
