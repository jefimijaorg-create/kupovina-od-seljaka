<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Од села до града — домаћи производи</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<header class="top">
  <a href="index.html" class="logo">Од села до града</a>
  <a href="mapa.html" class="cart-link" aria-label="Настави на преузимање">Корпа <b id="cartCount">0</b></a>
</header>

<main class="container">
  <section class="hero">
    <span>ДОМАЋЕ • ДИРЕКТНО • ПО ДОГОВОРУ</span>
    <h1>Куповина од сељака</h1>
    <p>Домаћи производи директно од газдинстава.</p>
  </section>

  <section id="nextDelivery" class="delivery-banner" aria-live="polite">
    <div>
      <small>СЛЕДЕЋА ДОСТАВА</small>
      <strong id="deliveryTitle">Учитавање...</strong>
      <span id="deliveryInfo">Поруџбине до среде у 22:00</span>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>Производи</h2>
      <span id="productStatus">Учитавање...</span>
    </div>
    <div id="productFilter" class="product-filter" aria-label="Филтер производа"></div>
    <div id="products" class="products"></div>
  </section>

  <div class="bottom-action">
    <button id="homeContinue" class="btn primary full" disabled>Настави →</button>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
