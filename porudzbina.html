<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поруџбина | Наручи домаће из Велике Плане</title><style>
body{margin:0;background:#f3f5f3;color:#18211b;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:18px 14px 50px}header{background:#18211b;color:#fff;padding:18px 0}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:#c8d0ca;font-size:12px}.card{background:#fff;border:1px solid #dfe5e0;border-radius:14px;padding:15px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #edf0ed;padding:9px 0}.label{color:#6d766f;font-size:12px}.value{font-weight:800;text-align:right}.status{display:inline-block;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#e8f3eb;color:#17633b}.item{padding:11px 0;border-top:1px solid #edf0ed}.item b{display:block}.total{font-size:19px;font-weight:950;margin-top:10px}.note{background:#fff8e8;border-radius:10px;padding:11px;margin-top:10px;font-size:13px}.actions{display:grid;gap:8px;margin-top:12px}.btn{border:0;border-radius:10px;padding:12px;font-weight:900;font-size:14px;text-decoration:none;text-align:center;cursor:pointer}.primary{background:#17633b;color:#fff}.viber{background:#665cac;color:#fff}.muted{background:#e8ece9;color:#18211b}.hint{font-size:11px;color:#6d766f;margin-top:9px;line-height:1.45}select{width:100%;padding:11px;border:1px solid #ccd5ce;border-radius:9px;background:#fff;font:inherit}</style></head><body>
<header><div class="wrap" style="padding:0"><h1>Поруџбина <span id="title">#—</span></h1><p>Наручи домаће из Велике Плане</p></div></header><main class="wrap"><div id="app">Учитавање...</div></main>
<script>
const U='https://kszkehxrcuagymlfowqj.supabase.co',K='sb_publishable_TRZp6skXsdIUsE4Vl65_2Q_QskFb532',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const api=async(p,o={})=>{const r=await fetch(U+'/rest/v1/'+p,{...o,headers:{...H,...(o.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()};
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=new URLSearchParams(location.search).get('id');let order,buyer={},point={},items=[];
async function load(){if(!id)return showError('Недостаје број поруџбине.');const o=await api('porudzbine?id=eq.'+encodeURIComponent(id)+'&select=id,created_at,status,ukupna_cena,napomena,adresa_dostave,telefon,kupac_id,punkt_id');if(!o.length)throw Error('Поруџбина није пронађена.');order=o[0];const [b,p,it]=await Promise.all([api('kupci?id=eq.'+order.kupac_id+'&select=id,ime_prezime,telefon,lokacija'),api('punktovi?id=eq.'+order.punkt_id+'&select=id,name,address,maps_url'),api('stavke_porudzbine?porudzbina_id=eq.'+order.id+'&select=id,proizvod,total_quantity,quantity_unit,kolicina,jedinica,cena_stavke,variant_name&order=id')]);buyer=b[0]||{};point=p[0]||{};items=it||[];render()}
function render(){document.getElementById('title').textContent='#'+order.id;const created=new Date(order.created_at).toLocaleString('sr-RS',{dateStyle:'short',timeStyle:'short'}),phone=order.telefon||buyer.telefon||'',msg='Ваша поруџбина #'+order.id+' је примљена.\\n\\nТачно време доставе јавићемо најкасније до петка.',viber='viber://chat?number='+encodeURIComponent(phone.startsWith('+')?phone:'+'+phone)+'&text='+encodeURIComponent(msg);document.getElementById('app').innerHTML=
'<div class="card"><div class="row"><span class="label">Датум и време поруџбине</span><span class="value">'+e(created)+'</span></div><div class="row"><span class="label">Купац</span><span class="value">'+e(buyer.ime_prezime||'—')+'</span></div><div class="row"><span class="label">Статус</span><span class="value"><span class="status">'+e(order.status||'примљено')+'</span></span></div></div>'+
'<div class="card"><b>Ставке поруџбине</b>'+items.map(x=>'<div class="item"><b>'+e(x.proizvod)+(x.variant_name?' — '+e(x.variant_name):'')+'</b><span>'+e((x.total_quantity??x.kolicina))+' '+e((x.quantity_unit??x.jedinica)||'')+' · '+Number(x.cena_stavke||0).toLocaleString('sr-RS')+' дин.</span></div>').join('')+'<div class="total">Укупно: '+Number(order.ukupna_cena||0).toLocaleString('sr-RS')+' дин.</div></div>'+
'<div class="card"><div class="row"><span class="label">Преузимање</span><span class="value">'+e(point.name||order.adresa_dostave||'—')+'</span></div><div class="row"><span class="label">Адреса</span><span class="value">'+e(point.address||order.adresa_dostave||'—')+'</span></div><div class="row"><span class="label">Контакт</span><span class="value">'+e(phone||'—')+'</span></div>'+(order.napomena?'<div class="note"><b>Напомена:</b> '+e(order.napomena)+'</div>':'')+'</div>'+
'<div class="card"><b>Обрада поруџбине</b><p class="hint">Овде мењамо статус поруџбине.</p><select id="status"><option>примљено</option><option>потврђено</option><option>у припреми</option><option>спремно</option><option>испоручено</option><option>отказано</option></select><div class="actions"><button class="btn primary" id="save">Сачувај статус</button><a class="btn viber" href="'+viber+'">Отвори Viber и пошаљи купцу</a><a class="btn muted" href="operativa-v2.html">← Оператива</a></div><div class="hint">„Ваша поруџбина #'+order.id+' је примљена. Тачно време доставе јавићемо најкасније до петка.“</div></div>';document.getElementById('status').value=order.status||'примљено';document.getElementById('save').onclick=saveStatus}
async function saveStatus(){const b=document.getElementById('save');b.disabled=true;try{const s=document.getElementById('status').value;await api('porudzbine?id=eq.'+order.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:s,updated_at:new Date().toISOString()})});order.status=s;render()}catch(x){alert('Грешка: '+x.message)}finally{b.disabled=false}}
function showError(m){document.getElementById('app').innerHTML='<div class="card">'+e(m)+'</div>'}load().catch(x=>showError(x.message));
</script></body></html>
