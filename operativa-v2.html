<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оператива — Наручи домаће из Велике Плане</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#172018;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:12px 12px 90px}
.top{position:sticky;top:0;z-index:30;background:#172018;color:#fff;padding:14px 12px;border-radius:0 0 18px 18px}.top h1{margin:0;font-size:21px}.top p{margin:4px 0 0;color:#cbd5ce;font-size:12px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 8px #0000000a}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.section-title h2{margin:0;font-size:17px}
.note{font-size:11px;color:#667067;line-height:1.45}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.tab{border:1px solid #d1d5db;background:#fff;border-radius:11px;padding:9px 4px;font-weight:900;font-size:11px}.tab.active{background:#172018;color:#fff;border-color:#172018}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stat{background:#f8faf8;border-radius:12px;padding:10px}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:#667067}
.row{border-top:1px solid #eef0ed;padding:12px 0}.row:first-child{border-top:0}.row-main{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-weight:900;font-size:14px}.qty{font-weight:900;font-size:15px;text-align:right}.meta{font-size:11px;color:#69736b;margin-top:3px;line-height:1.45}
.farm-card{border:1px solid #dfe5df;border-radius:14px;padding:13px;margin-top:9px;background:#fff}.farm-card button{width:100%;text-align:left;border:0;background:transparent;padding:0}.farm-head{display:flex;justify-content:space-between;gap:10px}.farm-name{font-size:16px;font-weight:900}.big{font-size:18px;font-weight:900}
.product{background:#f8faf8;border-radius:12px;padding:11px;margin-top:8px}.product-head{display:flex;justify-content:space-between;gap:8px}.packline{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid #e5e9e5;font-size:12px}
.badge{display:inline-block;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900;background:#e8eee9;color:#344238;margin:2px 3px 0 0}
input,select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px;background:#fff;font-weight:800}input:focus,select:focus{outline:2px solid #a7c4ae}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save{width:100%;border:0;border-radius:12px;background:#047857;color:#fff;padding:13px;font-weight:900;margin-top:12px}.danger{background:#fff7ed;border-color:#fed7aa}.ok{color:#166534}.warn{color:#a16207}
.hidden{display:none}.back{border:0;background:#eef2ee;border-radius:10px;padding:8px 11px;font-weight:900}.money{font-weight:900;font-size:16px}
@media(min-width:650px){.statgrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="wrap" style="padding:0 12px"><h1>Оператива</h1><p>Поруџбине → газдинства → преузимање → дуговање</p></div></header>
<main class="wrap">
<section class="card">
 <div class="section-title"><h2 id="tourTitle">Учитавање...</h2><span id="status" class="note"></span></div>
 <div class="statgrid">
  <div class="stat"><b id="buyers">0</b><span>купаца</span></div>
  <div class="stat"><b id="lineCount">0</b><span>ставки</span></div>
  <div class="stat"><b id="farmCount">0</b><span>газдинстава</span></div>
  <div class="stat"><b id="debtTotal">0</b><span>дуговање</span></div>
 </div>
 <div class="tabs">
  <button class="tab active" data-tab="orders">Поруџбине</button>
  <button class="tab" data-tab="farms">За газдинства</button>
  <button class="tab" data-tab="pickup">Преузимање</button>
  <button class="tab" data-tab="debt">Дуговања</button>
 </div>
</section>
<section id="view-orders" class="card">
 <div class="section-title"><h2>Поруџбине</h2><span class="note">шта су купци тражили</span></div>
 <div id="orders"></div>
</section>
<section id="view-farms" class="card hidden">
 <div class="section-title"><h2>Шта узимамо од газдинстава</h2><span class="note">шта треба да нам дају</span></div>
 <div id="farmPlan"></div>
</section>
<section id="view-pickup" class="card hidden">
 <div id="pickupHome"></div>
</section>
<section id="view-debt" class="card hidden">
 <div class="section-title"><h2>Дуговања</h2><span class="note">само стварно преузето</span></div>
 <div id="debts"></div>
</section>
</main>
<script>
const SUPABASE_URL='https://kszkehxrcuagymlfowqj.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_TRZp6skXsdIUsE4Vl65_2Q_QskFb532';
const headers={apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'};
const api=async(path,opts={})=>{const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opts,headers:{...headers,...(opts.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tour,rows=[],farms=[],products=[],payouts=[];

function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function farm(id){return farms.find(f=>String(f.id)===String(id))}
function farmName(id){return farm(id)?.name||'Није додељено'}
function unit(r){return r.jedinica||r.quantity_unit||''}
function qty(r){return num(r.kolicina||r.total_quantity)}
function price(r){const direct=num(r.nabavna_cena);if(direct>0)return direct;const p=products.find(x=>String(x.name).trim().toLowerCase()===String(r.proizvod||'').trim().toLowerCase());return p?num(p.purchase_price):0}

function packageInfo(r){
 let count=num(r.package_count), size=num(r.package_size), u=String(r.package_unit||'').trim();
 const text=String(r.package_info||r.napomena||'');
 if(!count){
  const a=text.match(/(\d+)\s*(?:×|x)?\s*(\d+(?:[.,]\d+)?)\s*(л|кг|kg|ком)/i);
  if(a){count=num(a[1]);size=num(String(a[2]).replace(',','.'));u=a[3]}
  else{const b=text.match(/(\d+)\s*(балон|балона|флаша|флаше|ком|комада)/i);if(b){count=num(b[1]);u=b[2]}}
 }
 if(!size&&count&&(u.includes('балон')||u.includes('флаш')))size=qty(r)/count;
 return {count,size,u};
}
function packageText(r){
 const p=packageInfo(r);if(!p.count)return 'Паковање није уписано';
 if(p.size)return p.count+' × '+p.size+' '+p.u;
 return p.count+' '+p.u;
}
function packageBreakdown(r){
 const text=String(r.package_info||r.napomena||'');
 const packs=[];
 const re=/(\\d+)\\s*(балон(?:а)?|флаш(?:а|е))\\s*(?:×|x)?\\s*(\\d+(?:[.,]\\d+)?)?\\s*л?/gi;
 let m;
 while((m=re.exec(text))!==null){
  const count=num(m[1]),type=/балон/i.test(m[2])?'balloon':'bottle';
  let size=num(String(m[3]||'').replace(',','.'));
  if(!size)size=type==='balloon'?6:2;
  packs.push({type,count,size});
 }
 if(!packs.length){
  const p=packageInfo(r);
  if(p.count&&(num(p.size)===6||num(p.size)===2))packs.push({type:num(p.size)===6?'balloon':'bottle',count:p.count,size:num(p.size)});
 }
 return packs;
}
function packTotals(g){
 const out={balloons:0,bottles:0,packedLitres:0};
 g.rows.forEach(r=>packageBreakdown(r).forEach(p=>{
  if(p.type==='balloon'&&p.size===6)out.balloons+=p.count;
  else if(p.type==='bottle'&&p.size===2)out.bottles+=p.count;
  out.packedLitres+=p.count*p.size;
 }));
 return out;
}
function packSummary(g){
 const p=packTotals(g),parts=[];
 if(p.balloons)parts.push(p.balloons+' '+(p.balloons===1?'балон':'балона')+' од 6 л ('+(p.balloons*6)+' л)');
 if(p.bottles)parts.push(p.bottles+' '+(p.bottles===1?'флаша':'флаша')+' од 2 л ('+(p.bottles*2)+' л)');
 const unassigned=Math.round((g.qty-p.packedLitres)*100)/100;
 if(unassigned>0)parts.push('још '+unassigned+' л без уписане амбалаже');
 return parts.length?parts.join(' + '):'Амбалажа није уписана';
}
function groupFarm(farmId){
 const rs=rows.filter(r=>String(r.dodijeljeno_gazdinstvo_id)===String(farmId));
 const g={};
 rs.forEach(r=>{
  const key=String(r.proizvod).trim().toLowerCase();
  g[key]??={product:r.proizvod,unit:unit(r),qty:0,packages:0,size:0,packUnit:'л',rows:[]};
  g[key].qty+=qty(r);g[key].packages+=packageInfo(r).count;g[key].rows.push(r);
 });
 return Object.values(g);
}

function renderHeader(){
 document.getElementById('buyers').textContent=new Set(rows.map(r=>r.porudzbina_id)).size;
 document.getElementById('lineCount').textContent=rows.length;
 document.getElementById('farmCount').textContent=farms.filter(f=>rows.some(r=>String(r.dodijeljeno_gazdinstvo_id)===String(f.id))).length;
 const debt=payouts.reduce((s,p)=>s+num(p.total_amount),0);
 document.getElementById('debtTotal').textContent=debt.toLocaleString('sr-RS')+' дин.';
}

function renderOrders(){
 const groups={};
 rows.forEach(r=>{const key=r.porudzbina_id;groups[key]??=[];groups[key].push(r)});
 document.getElementById('orders').innerHTML=Object.entries(groups).map(([oid,rs])=>
  '<div class="farm-card"><div class="row-main"><div><div class="name">Поруџбина #'+esc(oid)+'</div><div class="meta">'+esc(rs[0].recipient_name||'Купац')+'</div></div><div class="qty">'+rs.length+' ставки</div></div>'+
  rs.map(r=>'<div class="product"><div class="product-head"><div><b>'+esc(r.proizvod)+'</b><div class="meta">'+esc(qty(r))+' '+esc(unit(r))+' · '+esc(packageText(r))+'</div></div><div class="qty">'+esc(farmName(r.dodijeljeno_gazdinstvo_id))+'</div></div>'+
  '<div class="meta">'+(r.napomena?esc(r.napomena):'')+'</div></div>').join('')+'</div>'
 ).join('')||'<div class="note">Нема поруџбина.</div>';
}

function renderFarmPlan(){
 const assigned=farms.filter(f=>rows.some(r=>String(r.dodijeljeno_gazdinstvo_id)===String(f.id)));
 const unassigned=rows.filter(r=>!r.dodijeljeno_gazdinstvo_id);
 let html=assigned.map(f=>{
  const gs=groupFarm(f.id),total=gs.reduce((s,g)=>s+g.qty,0);
  return '<div class="farm-card"><div class="farm-head"><div><div class="farm-name">'+esc(f.name)+'</div><div class="meta">'+gs.length+' производа</div></div><div class="big">'+total+' јед.</div></div>'+
   gs.map(g=>'<div class="product"><div class="product-head"><b>'+esc(g.product)+'</b><b>'+g.qty+' '+esc(g.unit)+'</b></div>'+
    '<div class="meta">'+(/млеко|сурутка/i.test(g.product)?esc(packSummary(g)):(g.packages?g.packages+' паковања':'Амбалажа није уписана'))+'</div></div>').join('')+
   '</div>';
 }).join('');
 if(unassigned.length)html+='<div class="farm-card danger"><div class="name">Није додељено газдинству</div><div class="meta">'+unassigned.map(r=>esc(r.proizvod)+' — '+qty(r)+' '+esc(unit(r))).join('<br>')+'</div></div>';
 document.getElementById('farmPlan').innerHTML=html||'<div class="note">Нема додељених ставки.</div>';
}

function renderPickupHome(){
 const assigned=farms.filter(f=>rows.some(r=>String(r.dodijeljeno_gazdinstvo_id)===String(f.id)));
 document.getElementById('pickupHome').innerHTML='<div class="section-title"><h2>Преузимање</h2><span class="note">контрола на лицу места</span></div>'+
 '<div class="note" style="margin-top:6px">Изабери газдинство код ког си стигао. Овде провераваш шта ти стварно даје, по паковањима. Само стварно преузето улази у дуговање.</div>'+
 assigned.map(f=>{
  const gs=groupFarm(f.id),done=payouts.find(p=>String(p.producer_id)===String(f.id));
  return '<button class="farm-card" data-open-pickup="'+f.id+'"><div class="farm-head"><div><div class="farm-name">'+esc(f.name)+'</div><div class="meta">'+gs.length+' производа за преузимање</div></div><div class="big">'+(done?num(done.total_amount).toLocaleString('sr-RS')+' дин.':'није преузето')+'</div></div>'+
  gs.map(g=>'<div class="meta" style="margin-top:6px">• '+esc(g.product)+' — '+g.qty+' '+esc(g.unit)+( /млеко|сурутка/i.test(g.product)?' · '+esc(packSummary(g)):'')+'</div>').join('')+'</button>';
 }).join('')||'<div class="note">Нема додељених газдинстава.</div>';
 document.querySelectorAll('[data-open-pickup]').forEach(b=>b.onclick=()=>openPickup(num(b.dataset.openPickup)));
}

function openPickup(farmId){
 const f=farm(farmId),gs=groupFarm(farmId);if(!f)return;
 const root=document.getElementById('pickupHome');
 root.innerHTML='<button class="back" id="backPickup">← Сва газдинства</button><div style="margin-top:12px"><div class="farm-name">Преузимање — '+esc(f.name)+'</div><div class="note">За сваки производ означи да ли је преузет. Код млека уноси број балона и флаша одвојено.</div></div>'+
 gs.map((g,i)=>{
  const milk=/млеко|сурутка/i.test(g.product),packs=packTotals(g);
  const already=g.rows.some(r=>num(r.preuzeta_kolicina)>0||String(r.status_stavke||'').includes('preuzeto'));
  const qtyDefault=already?g.rows.reduce((s,r)=>s+num(r.preuzeta_kolicina),0):g.qty;
  return '<div class="farm-card pickup-item" data-item="'+i+'" data-picked="'+(already?'yes':'no')+'"><div class="product-head"><div><div class="name">'+esc(g.product)+'</div><div class="meta">Потребно: '+g.qty+' '+esc(g.unit)+(milk?' · '+esc(packSummary(g)):'')+'</div></div><div class="qty">'+price(g.rows[0]).toLocaleString('sr-RS')+' дин./'+esc(g.unit)+'</div></div>'+
   '<div class="two" style="margin-top:10px"><button type="button" class="tab '+(already?'':'active')+'" data-not-picked="'+i+'">Није преузето</button><button type="button" class="tab '+(already?'active':'')+'" data-picked="'+i+'">Преузето</button></div>'+
   (milk?'<div class="two" style="margin-top:10px"><label class="meta">Балони од 6 л<input data-pack-balloon="'+i+'" type="number" min="0" step="1" value="'+packs.balloons+'"></label><label class="meta">Флаше од 2 л<input data-pack-bottle="'+i+'" type="number" min="0" step="1" value="'+packs.bottles+'"></label></div><div class="meta" data-pack-total="'+i+'"></div>':'')+
   '<label class="meta" style="display:block;margin-top:10px">Стварно преузета количина ('+esc(g.unit)+')<input data-pick-qty="'+i+'" type="number" min="0" step="0.01" value="'+qtyDefault+'"></label>'+
   '<div class="meta" data-pick-line="'+i+'"></div></div>';
 }).join('')+
 '<div class="card" style="background:#f8faf8"><div class="row-main"><div><div class="name">За плаћање</div><div class="meta">Обрачунава се само оно што је означено као преузето.</div></div><div class="money" id="pickTotal">0 дин.</div></div></div>'+
 '<button class="save" id="savePick">Сачувај преузимање и дуговање</button>';
 document.getElementById('backPickup').onclick=renderPickupHome;
 root.querySelectorAll('[data-not-picked]').forEach(b=>b.onclick=()=>{
  const i=num(b.dataset.notPicked),item=root.querySelector('[data-item="'+i+'"]');item.dataset.picked='no';
  item.querySelector('[data-not-picked]').classList.add('active');item.querySelector('[data-picked="'+i+'"]').classList.remove('active');
  const q=item.querySelector('[data-pick-qty="'+i+'"]');if(q)q.value=0;const b=item.querySelector('[data-pack-balloon="'+i+'"]');if(b)b.value=0;const f=item.querySelector('[data-pack-bottle="'+i+'"]');if(f)f.value=0;recalcPickup(gs);
 });
 root.querySelectorAll('[data-picked]').forEach(b=>{if(b.tagName!=='BUTTON')return;b.onclick=()=>{
  const i=num(b.dataset.picked),item=root.querySelector('[data-item="'+i+'"]');item.dataset.picked='yes';
  item.querySelector('[data-picked="'+i+'"]').classList.add('active');item.querySelector('[data-not-picked="'+i+'"]').classList.remove('active');
  const g=gs[i];if(num(item.querySelector('[data-pick-qty="'+i+'"]').value)===0)item.querySelector('[data-pick-qty="'+i+'"]').value=g.qty;recalcPickup(gs);
 }});
 const markPicked=i=>{const item=root.querySelector('[data-item="'+i+'"]');if(num(item.querySelector('[data-pick-qty="'+i+'"]').value)>0){item.dataset.picked='yes';item.querySelector('[data-picked="'+i+'"]').classList.add('active');item.querySelector('[data-not-picked="'+i+'"]').classList.remove('active');}};
 root.querySelectorAll('[data-pack-balloon],[data-pack-bottle]').forEach(x=>x.oninput=()=>{
  const i=num(x.dataset.packBalloon??x.dataset.packBottle),item=root.querySelector('[data-item="'+i+'"]');
  const balloons=num(item.querySelector('[data-pack-balloon="'+i+'"]')?.value),bottles=num(item.querySelector('[data-pack-bottle="'+i+'"]')?.value);
  const litres=balloons*6+bottles*2,el=item.querySelector('[data-pack-total="'+i+'"]');
  if(el)el.textContent='Паковање: '+balloons+' балона × 6 л + '+bottles+' флаша × 2 л = '+litres+' л';
  markPicked(i);recalcPickup(gs);
 });
 root.querySelectorAll('[data-pick-qty]').forEach(x=>x.oninput=()=>{
  const i=num(x.dataset.pickQty);markPicked(i);recalcPickup(gs);
 });
 document.getElementById('savePick').onclick=()=>savePickup(farmId,gs);
 recalcPickup(gs);
}
function recalcPickup(gs){
 let total=0;
 gs.forEach((g,i)=>{
  const item=document.querySelector('[data-item="'+i+'"]');
  const picked=item?.dataset.picked==='yes';
  const q=picked?num(item.querySelector('[data-pick-qty="'+i+'"]')?.value):0;
  const pr=price(g.rows[0]);total+=q*pr;
  const el=document.querySelector('[data-pick-line="'+i+'"]');
  if(el)el.textContent=(picked?'Преузето: ':'Није преузето')+q+' '+g.unit+' · '+(q*pr).toLocaleString('sr-RS')+' дин.';
  const packEl=document.querySelector('[data-pack-total="'+i+'"]');
  if(packEl){const item=document.querySelector('[data-item="'+i+'"]'),b=num(item.querySelector('[data-pack-balloon="'+i+'"]')?.value),f=num(item.querySelector('[data-pack-bottle="'+i+'"]')?.value),litres=b*6+f*2;packEl.textContent='Паковање: '+b+' балона × 6 л + '+f+' флаша × 2 л = '+litres+' л'+(Math.abs(litres-q)>0.01?' · РАЗЛИКА: '+Math.abs(litres-q).toLocaleString('sr-RS')+' л':' · поклапа се са количином');}
 });
 const el=document.getElementById('pickTotal');if(el)el.textContent=total.toLocaleString('sr-RS')+' дин.';
}
async function savePickup(farmId,gs){
 const btn=document.getElementById('savePick');btn.disabled=true;btn.textContent='Чувам...';
 try{
  let total=0;
  for(let i=0;i<gs.length;i++){
   const g=gs[i],item=document.querySelector('[data-item="'+i+'"]'),picked=item?.dataset.picked==='yes';
   const actual=picked?num(item.querySelector('[data-pick-qty="'+i+'"]')?.value):0,pr=price(g.rows[0]);total+=actual*pr;
   let left=actual;
   for(const r of g.rows){
    const taken=Math.min(qty(r),Math.max(0,left));left-=taken;
    await api('stavke_porudzbine?id=eq.'+r.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({preuzeta_kolicina:taken,nabavna_cena:pr,status_stavke:taken>=qty(r)?'preuzeto':(taken>0?'delimicno_preuzeto':'nije_preuzeto')})});
   }
  }
  const ex=payouts.find(p=>String(p.producer_id)===String(farmId));
  if(ex)await api('producer_payouts?id=eq.'+ex.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({total_amount:total,is_paid:false})});
  else await api('producer_payouts',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({producer_id:farmId,period:tour.datum,total_amount:total,is_paid:false,tura_id:tour.id})});
  alert('Преузимање је сачувано. За плаћање: '+total.toLocaleString('sr-RS')+' дин.');
  await reload();showTab('debt');
 }catch(e){alert('Није сачувано: '+e.message);console.error(e)}
 finally{btn.disabled=false;btn.textContent='Сачувај преузимање и дуговање'}
}

function renderDebts(){
 document.getElementById('debts').innerHTML=farms.map(f=>{const p=payouts.find(x=>String(x.producer_id)===String(f.id));return '<div class="farm-card"><div class="farm-head"><div><div class="farm-name">'+esc(f.name)+'</div><div class="meta">'+(p?(p.is_paid?'Плаћено':'Није плаћено'):'Није још преузето')+'</div></div><div class="money">'+(p?num(p.total_amount).toLocaleString('sr-RS')+' дин.':'—')+'</div></div></div>'}).join('')||'<div class="note">Нема дуговања.</div>';
}

function showTab(tab){
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 ['orders','farms','pickup','debt'].forEach(x=>document.getElementById('view-'+x).classList.toggle('hidden',x!==tab));
 if(tab==='pickup')renderPickupHome();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

async function reload(){
 const ts=await api('ture?select=id,naziv,datum,status&datum=eq.2026-10-04&order=id.desc&limit=1');tour=ts[0];
 farms=await api('gazdinstva?select=id,name,is_active&is_active=eq.true&order=name.asc');
 products=await api('products?select=id,name,purchase_price,unit,gazdinstvo_id&is_active=eq.true&order=name.asc');
 rows=await api('stavke_porudzbine?select=id,porudzbina_id,proizvod,kolicina,jedinica,dodijeljeno_gazdinstvo_id,package_info,package_count,package_size,package_unit,recipient_name,napomena,preuzeta_kolicina,nabavna_cena,status_stavke&tura_id=eq.'+tour.id+'&order=id.asc&limit=500');
 payouts=await api('producer_payouts?select=id,producer_id,total_amount,is_paid,tura_id,period&tura_id=eq.'+tour.id);
 renderHeader();renderOrders();renderFarmPlan();renderPickupHome();renderDebts();
 document.getElementById('tourTitle').textContent=tour.naziv||('Достава '+tour.datum);document.getElementById('status').textContent='директно из базе';
}
async function init(){try{await reload()}catch(e){document.getElementById('status').textContent='грешка';console.error(e)}}
init();
</script>
