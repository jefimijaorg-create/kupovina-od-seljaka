<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Поруџбине — Наручи домаће из Велике Плане</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#172018;font-family:Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:0 12px 40px}
.top{background:#172018;color:#fff;padding:16px 0;border-radius:0 0 18px 18px}
h1{margin:0;font-size:21px}.sub{margin-top:4px;color:#cbd5ce;font-size:12px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin-top:12px}
.head{display:flex;justify-content:space-between;gap:10px;align-items:center}
h2{margin:0;font-size:17px}.note{font-size:11px;color:#667067}
.order{border-top:1px solid #e5e7eb;padding:14px 0}.order:first-child{border-top:0}
.buyer{font-size:16px;font-weight:900}.orderid{font-size:11px;color:#68736b;margin-top:2px}
.item{background:#f8faf8;border-radius:12px;padding:10px;margin-top:8px}
.itemtop{display:flex;justify-content:space-between;gap:10px}
.product{font-weight:900;font-size:14px}.qty{font-weight:900;text-align:right;white-space:nowrap}
.meta{font-size:11px;color:#69736b;margin-top:4px;line-height:1.45}
.loading{text-align:center;padding:25px;color:#667067}
.error{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;color:#9a3412}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<h1>Поруџбине</h1>
<div class="sub">Наручи домаће из Велике Плане</div>
</div></header>

<main class="wrap">
<section class="card">
<div class="head">
<h2 id="tourTitle">Учитавање...</h2>
<span id="tourDate" class="note"></span>
</div>
</section>

<section class="card">
<div class="head">
<h2>Листа поруџбина</h2>
<span id="count" class="note"></span>
</div>
<div id="orders"><div class="loading">Учитавање поруџбина...</div></div>
</section>
</main>

<script>
const URL='https://kszkehxrcuagymlfowqj.supabase.co';
const KEY='sb_publishable_TRZp6skXsdIUsE4Vl65_2Q_QskFb532';
const headers={apikey:KEY,Authorization:'Bearer '+KEY};
const api=async path=>{
 const r=await fetch(URL+'/rest/v1/'+path,{headers});
 if(!r.ok)throw new Error(await r.text());
 return r.json();
};
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function packageText(r){
 if(r.package_info) return r.package_info;
 const count=Number(r.package_count||r.broj_pakovanja||0);
 const size=Number(r.package_size||0);
 const unit=r.package_unit||'л';
 if(count&&size)return count+' × '+size+' '+unit;
 return (r.kolicina??'')+' '+(r.jedinica||r.quantity_unit||'');
}

async function boot(){
 try{
  const tours=await api('ture?order=datum.desc,id.desc&limit=1');
  const tour=tours[0];
  if(!tour)throw new Error('Нема активне туре.');

  const rows=await api('stavke_porudzbine?tura_id=eq.'+tour.id+'&order=porudzbina_id.asc,id.asc');

  document.getElementById('tourTitle').textContent=tour.naziv||('Тура '+tour.datum);
  document.getElementById('tourDate').textContent=tour.datum?new Date(tour.datum+'T00:00:00').toLocaleDateString('sr-RS'):'';
  document.getElementById('count').textContent=rows.length+' ставки';

  const groups={};
  rows.forEach(r=>{
   const id=r.porudzbina_id;
   if(!groups[id])groups[id]=[];
   groups[id].push(r);
  });

  const html=Object.entries(groups).map(([id,items])=>{
   const buyer=items[0].recipient_name||'Купац';
   return '<div class="order">'+
    '<div class="buyer">'+esc(buyer)+'</div>'+
    '<div class="orderid">Поруџбина #'+esc(id)+'</div>'+
    items.map(r=>'<div class="item">'+
      '<div class="itemtop"><div class="product">'+esc(r.proizvod)+'</div><div class="qty">'+esc(r.kolicina)+' '+esc(r.jedinica||r.quantity_unit||'')+'</div></div>'+
      '<div class="meta">'+esc(packageText(r))+'</div>'+
      (r.napomena?'<div class="meta">'+esc(r.napomena)+'</div>':'')+
      '</div>').join('')+
   '</div>';
  }).join('');

  document.getElementById('orders').innerHTML=html||'<div class="loading">Нема поруџбина за ову туру.</div>';
 }catch(e){
  document.getElementById('tourTitle').textContent='Грешка';
  document.getElementById('orders').innerHTML='<div class="error">Није могуће учитати поруџбине.<br>'+esc(e.message)+'</div>';
 }
}
boot();
</script>
</body>
</html>
