<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оператива — Наручи домаће из Велике Плане</title><style>
:root{--ink:#18211b;--muted:#6d766f;--line:#e2e7e3;--bg:#f3f5f3;--soft:#f7f9f7;--green:#17633b;--greenbg:#e8f3eb;--red:#a33b25;--redbg:#fff0ec;--orange:#8b5b16;--orangebg:#fff7e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}.wrap{max-width:760px;margin:auto;padding:0 12px 90px}.top{background:var(--ink);color:#fff;padding:17px 0}.top h1{margin:0;font-size:23px}.top p{margin:3px 0 0;color:#c5cec8;font-size:11px}.tour{background:#fff;border-bottom:1px solid var(--line);padding:11px 0}.tourin{display:flex;justify-content:space-between;align-items:center;gap:8px}.tourname{font-weight:900;font-size:14px}.hint{font-size:11px;color:var(--muted);line-height:1.4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 3px;font-size:11px;font-weight:900}.tab.active{background:var(--ink);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.head h2{font-size:17px;margin:0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}select,input{width:100%;border:1px solid #ccd5ce;border-radius:9px;padding:9px;background:#fff}.buyer,.farm,.debt{border:1px solid var(--line);border-radius:13px;margin-top:9px;overflow:hidden;background:#fff}.buyerhead,.farmhead{padding:11px 12px;background:var(--soft);display:flex;justify-content:space-between;gap:8px}.buyername,.farmname{font-weight:950;font-size:15px}.item,.product{padding:11px 12px;border-top:1px solid var(--line)}.itemtop,.prodtop{display:flex;justify-content:space-between;gap:10px}.productname{font-weight:900;font-size:13px}.qty{font-weight:950;text-align:right;white-space:nowrap}.meta{font-size:11px;color:var(--muted);margin-top:3px}.assign{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:9px}.assign button,.primary{border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:900;padding:9px 12px}.status{display:inline-block;padding:3px 6px;border-radius:999px;font-size:9px;font-weight:900;margin-top:6px}.ok{background:var(--greenbg);color:var(--green)}.warn{background:var(--orangebg);color:var(--orange)}.bad{background:var(--redbg);color:var(--red)}.customers{margin-top:8px}.customer{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:7px 0;border-top:1px solid #edf0ed;font-size:11px}.customer span{color:var(--muted)}.pickline{padding:11px 12px;border-top:1px solid var(--line)}.pickinputs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.pickbuttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.taken,.not{border-radius:9px;padding:9px;font-weight:900}.taken{border:1px solid #c9dfcf;background:var(--greenbg);color:var(--green)}.not{border:1px solid var(--line);background:#fff}.result{font-size:11px;color:var(--muted);margin-top:7px}.debt{padding:12px}.debtrow{display:flex;justify-content:space-between;gap:8px}.amount{font-size:17px;font-weight:950}.pay{width:100%;margin-top:9px;border:0;border-radius:9px;background:var(--ink);color:#fff;padding:10px;font-weight:900}.notice{margin-top:9px;padding:9px;border-radius:9px;background:var(--orangebg);font-size:11px;color:#80510f}.empty{text-align:center;padding:25px 5px;color:var(--muted);font-size:12px}.hidden{display:none}@media(max-width:520px){.customer{grid-template-columns:1fr auto}.customer span{grid-column:1}.customer b:last-child{grid-column:2;grid-row:1/3}}
</style></head><body>
<header class="top"><div class="wrap" style="padding-bottom:0"><h1>Оператива</h1><p>Поруџбине → газдинства → преузимање → дуговања</p></div></header>
<div class="tour"><div class="wrap" style="padding-bottom:0"><div class="tourin"><div><div class="tourname" id="tourTitle">Учитавање...</div><div class="hint" id="tourDate"></div></div><div class="hint" id="status"></div></div></div></div>
<main class="wrap"><div class="stats"><div class="stat"><b id="buyers">0</b><span>купаца</span></div><div class="stat"><b id="lineCount">0</b><span>ставки</span></div><div class="stat"><b id="farmCount">0</b><span>газдинстава</span></div></div>
<nav class="tabs"><button class="tab active" data-tab="orders">Поруџбине</button><button class="tab" data-tab="farms">Газдинства</button><button class="tab" data-tab="pickup">Преузимање</button><button class="tab" data-tab="debt">Дуговања</button></nav>
<section id="view-orders" class="panel"><div class="head"><h2>Поруџбине</h2><span class="hint">Купац → његове ставке</span></div><div class="filters"><select id="buyer"><option value="">Сви купци</option></select><select id="product"><option value="">Сви производи</option></select><select id="farmFilter"><option value="">Сва газдинства</option></select><select id="statusFilter"><option value="">Сви статуси</option><option value="none">Није додељено</option><option value="assigned">Додељено</option><option value="taken">Преузето</option></select></div><div id="orders"></div></section>
<section id="view-farms" class="panel hidden"><div class="head"><h2>Газдинства</h2><span class="hint">Шта треба да узмем</span></div><div id="farms"></div></section>
<section id="view-pickup" class="panel hidden"><div class="head"><h2>Преузимање</h2><span class="hint">Унеси само стварно преузето</span></div><div id="pickup"></div></section>
<section id="view-debt" class="panel hidden"><div class="head"><h2>Дуговања</h2><span class="hint">Плати следећи пут</span></div><div id="debt"></div></section></main>
<script>
const U='https://kszkehxrcuagymlfowqj.supabase.co',K='sb_publishable_TRZp6skXsdIUsE4Vl65_2Q_QskFb532',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const api=async(p,o={})=>{const r=await fetch(U+'/rest/v1/'+p,{...o,headers:{...H,...(o.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()};
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=v=>Number(v)||0;
let tour,rows=[],fs=[],ps=[],payouts=[];
const farm=id=>fs.find(x=>String(x.id)===String(id)),fname=id=>farm(id)?.name||'Није додељено',q=r=>n(r.kolicina||r.total_quantity),unit=r=>r.jedinica||r.quantity_unit||'';
const price=r=>{const x=n(r.nabavna_cena);if(x)return x;const p=ps.find(x=>String(x.name).toLowerCase().trim()===String(r.proizvod).toLowerCase().trim());return n(p?.purchase_price)};
const pack=r=>{const c=n(r.package_count||r.broj_pakovanja),s=n(r.package_size);return c&&s?c+' × '+(r.velicina_pakovanja||'паковање')+' = '+c*s+' '+(r.package_unit||'л'):q(r)+' '+unit(r)};
const state=r=>{if(!r.dodijeljeno_gazdinstvo_id)return['Није додељено','bad'];if(n(r.preuzeta_kolicina)>=q(r))return['Преузето','ok'];if(n(r.preuzeta_kolicina)>0)return['Делимично','warn'];return['Није преузето','warn']};
function opts(id){return'<option value="">Изабери газдинство</option>'+fs.map(f=>'<option value="'+f.id+'" '+(String(id)===String(f.id)?'selected':'')+'>'+e(f.name)+'</option>').join('')}
function renderOrders(){const b=document.getElementById('buyer').value,p=document.getElementById('product').value,f=document.getElementById('farmFilter').value,s=document.getElementById('statusFilter').value;const rr=rows.filter(r=>(!b||(r.recipient_name||'Купац')===b)&&(!p||r.proizvod===p)&&(!f||String(r.dodijeljeno_gazdinstvo_id||'')===f)&&(!s||(s==='none'&&!r.dodijeljeno_gazdinstvo_id)||(s==='assigned'&&r.dodijeljeno_gazdinstvo_id)||(s==='taken'&&n(r.preuzeta_kolicina)>=q(r))));const g={};rr.forEach(r=>(g[r.recipient_name||'Купац '+r.porudzbina_id]??=[]).push(r));document.getElementById('orders').innerHTML=Object.entries(g).map(([name,rs])=>'<div class="buyer"><div class="buyerhead"><div class="buyername">'+e(name)+'</div><span class="hint">'+rs.length+' '+(rs.length===1?'ставка':'ставке')+'</span></div>'+rs.map(r=>{const st=state(r);return'<div class="item"><div class="itemtop"><div><div class="productname">'+e(r.proizvod)+'</div><div class="meta">'+e(pack(r))+'</div></div><div class="qty">'+e(q(r)+' '+unit(r))+'</div></div><div class="status '+st[1]+'">'+st[0]+'</div> <b>'+e(fname(r.dodijeljeno_gazdinstvo_id))+'</b><div class="assign"><select data-s="'+r.id+'">'+opts(r.dodijeljeno_gazdinstvo_id)+'</select><button data-a="'+r.id+'">Додели</button></div></div>'}).join('')+'</div>').join('')||'<div class="empty">Нема ставки.</div>';document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>assign(x.dataset.a))}
async function assign(id){const f=document.querySelector('[data-s="'+id+'"]').value;if(!f)return alert('Изабери газдинство.');try{await api('stavke_porudzbine?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({dodijeljeno_gazdinstvo_id:n(f)})});await reload()}catch(x){alert('Грешка: '+x.message)}}
function renderFarms(){const assigned=fs.filter(f=>rows.some(r=>String(r.dodijeljeno_gazdinstvo_id)===String(f.id)));let html=assigned.map(f=>{const rr=rows.filter(r=>String(r.dodijeljeno_gazdinstvo_id)===String(f.id)),g={};rr.forEach(r=>(g[String(r.proizvod).toLowerCase()]??=[]).push(r));return'<div class="farm"><div class="farmhead"><div class="farmname">'+e(f.name)+'</div><b>'+rr.reduce((s,r)=>s+q(r),0)+' укупно</b></div>'+Object.values(g).map(rs=>'<div class="product"><div class="prodtop"><b>'+e(rs[0].proizvod)+'</b><b>'+rs.reduce((s,r)=>s+q(r),0)+' '+e(unit(rs[0]))+'</b></div><div class="meta">'+[...new Set(rs.map(pack))].map(x=>e(x)).join('<br>')+'</div><div class="customers">'+rs.map(r=>'<div class="customer"><b>'+e(r.recipient_name||'Купац')+'</b><span>'+e(pack(r))+'</span><b>'+e(q(r)+' '+unit(r))+'</b></div>').join('')+'</div></div>').join('')+'</div>'}).join('');const un=rows.filter(r=>!r.dodijeljeno_gazdinstvo_id);if(un.length)html+='<div class="farm" style="padding:12px;background:var(--redbg)"><b>Није додељено</b>'+un.map(r=>'<div class="meta">'+e(r.recipient_name||'Купац')+' — '+e(r.proizvod)+' — '+e(pack(r))+'</div>').join('')+'</div>';document.getElementById('farms').innerHTML=html||'<div class="empty">Нема додељених ставки.</div>'}
function groups(fid){const g={};rows.filter(r=>String(r.dodijeljeno_gazdinstvo_id)===String(fid)).forEach(r=>{const k=String(r.proizvod).toLowerCase()+'|'+r.package_size+'|'+r.package_unit+'|'+r.velicina_pakovanja;(g[k]??={p:r.proizvod,label:r.velicina_pakovanja||'паковање',size:n(r.package_size),unit:r.package_unit||'л',planned:0,rs:[]});g[k].planned+=n(r.package_count||r.broj_pakovanja);g[k].rs.push(r)});return Object.values(g)}
function renderPickup(){const html=fs.filter(f=>rows.some(r=>String(r.dodijeljeno_gazdinstvo_id)===String(f.id))).map(f=>{const gs=groups(f.id);return'<div class="farm"><div class="farmhead"><div class="farmname">'+e(f.name)+'</div><b>'+gs.reduce((s,g)=>s+g.planned*g.size,0)+' л</b></div>'+gs.map((g,i)=>{const key=f.id+'-'+i,cur=g.rs.reduce((s,r)=>s+Math.min(n(r.preuzeta_kolicina)/g.size,n(r.package_count||r.broj_pakovanja)),0);return'<div class="pickline"><div class="prodtop"><div><b>'+e(g.p)+'</b><div class="meta">'+g.planned+' × '+e(g.label)+' = '+g.planned*g.size+' '+e(g.unit)+'</div></div><b>'+price(g.rs[0]).toLocaleString('sr-RS')+' дин./'+e(g.unit)+'</b></div><div class="meta">'+g.rs.map(r=>e(r.recipient_name||'Купац')+' — '+e(pack(r))).join('<br>')+'</div><div class="pickinputs"><label class="hint">Планирано<input value="'+g.planned+'" disabled></label><label class="hint">Преузето<input id="c-'+key+'" type="number" min="0" max="'+g.planned+'" value="'+cur+'"></label></div><div class="pickbuttons"><button class="taken" data-t="'+key+'">ПРЕУЗЕТО</button><button class="not" data-n="'+key+'">НИЈЕ ПРЕУЗЕТО</button></div><div class="result" id="r-'+key+'"></div></div>'}).join('')+'</div>'}).join('');document.getElementById('pickup').innerHTML=html||'<div class="empty">Нема додељених ставки.</div>';document.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>savePick(x.dataset.t,true));document.querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>savePick(x.dataset.n,false))}
async function savePick(key,taken){const [fid,i]=key.split('-'),g=groups(n(fid))[n(i)],input=document.getElementById('c-'+key),count=taken?Math.min(n(input.value),g.planned):0;let rem=count*g.size;try{for(const r of g.rs){const av=n(r.package_count||r.broj_pakovanja)*n(r.package_size),take=Math.min(av,rem);rem-=take;await api('stavke_porudzbine?id=eq.'+r.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({preuzeta_kolicina:take,nabavna_cena:price(r),status_stavke:take>=q(r)?'preuzeto':take?'delimicno_preuzeto':'nije_preuzeto'})});if(rem<=0)break}const amount=count*g.size*price(g.rs[0]);const old=payouts.find(x=>String(x.producer_id)===String(fid)&&String(x.tura_id)===String(tour.id));if(old){await api('producer_payouts?id=eq.'+old.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({total_amount:amount,is_paid:false})})}else if(amount){await api('producer_payouts',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({producer_id:n(fid),period:tour.datum,total_amount:amount,is_paid:false,tura_id:tour.id})})}await reload();show('pickup')}catch(x){alert('Није сачувано: '+x.message)}}
function renderDebt(){const d=payouts.filter(x=>!x.is_paid&&n(x.total_amount)>0),total=d.reduce((s,x)=>s+n(x.total_amount),0);document.getElementById('debt').innerHTML='<div class="notice">Свака преузета количина улази у дуг. Када следећи пут платиш газдинству, овде означиш то дуговање као плаћено.</div><div class="stats"><div class="stat"><b>'+d.length+'</b><span>дуговања</span></div><div class="stat"><b>'+total.toLocaleString('sr-RS')+'</b><span>дин. укупно</span></div><div class="stat"><b>'+d.filter(x=>String(x.tura_id)===String(tour.id)).length+'</b><span>ова тура</span></div></div>'+ (d.length?d.map(x=>'<div class="debt"><div class="debtrow"><div><div class="farmname">'+e(fname(x.producer_id))+'</div><div class="hint">Тура '+e(x.tura_id)+' · '+e(x.period||'')+'</div></div><div class="amount">'+n(x.total_amount).toLocaleString('sr-RS')+' дин.</div></div><button class="pay" data-pay="'+x.id+'">ПЛАЋЕНО — означи као плаћено</button></div>').join(''):'<div class="empty">Нема неплаћених дуговања.</div>');document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>pay(b.dataset.pay))}
async function pay(id){const x=payouts.find(p=>String(p.id)===String(id));if(!x||!confirm('Означити '+n(x.total_amount).toLocaleString('sr-RS')+' дин. за '+fname(x.producer_id)+' као плаћено?'))return;try{await api('producer_payouts?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({is_paid:true})});await reload();show('debt')}catch(e){alert('Није сачувано: '+e.message)}}
function show(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.querySelectorAll('[id^="view-"]').forEach(x=>x.classList.add('hidden'));document.getElementById('view-'+t).classList.remove('hidden');if(t==='orders')renderOrders();if(t==='farms')renderFarms();if(t==='pickup')renderPickup();if(t==='debt')renderDebt()}
async function reload(){const [ts,rs,f,p,po]=await Promise.all([api('ture?order=datum.desc,id.desc&limit=1'),api('stavke_porudzbine?tura_id=eq.'+(tour?.id||0)+'&order=id.asc'),api('gazdinstva?is_active=eq.true&order=name.asc'),api('products?select=id,name,purchase_price,unit&order=name.asc'),api('producer_payouts?order=id.asc')]);tour=ts?.[0]||tour;rows=rs||[];fs=f||[];ps=p||[];payouts=po||[];document.getElementById('tourTitle').textContent=tour?.naziv||'Тура';document.getElementById('tourDate').textContent=tour?.datum?new Date(tour.datum+'T00:00:00').toLocaleDateString('sr-RS'):'';document.getElementById('status').textContent=tour?.status||'';document.getElementById('buyers').textContent=new Set(rows.map(r=>r.recipient_name||r.porudzbina_id)).size;document.getElementById('lineCount').textContent=rows.length;document.getElementById('farmCount').textContent=new Set(rows.map(r=>r.dodijeljeno_gazdinstvo_id).filter(Boolean)).size;const bs=[...new Set(rows.map(r=>r.recipient_name||'Купац'))].sort(),pr=[...new Set(rows.map(r=>r.proizvod).filter(Boolean))].sort();buyer.innerHTML='<option value="">Сви купци</option>'+bs.map(x=>'<option>'+e(x)+'</option>').join('');product.innerHTML='<option value="">Сви производи</option>'+pr.map(x=>'<option>'+e(x)+'</option>').join('');farmFilter.innerHTML='<option value="">Сва газдинства</option>'+fs.map(x=>'<option value="'+x.id+'">'+e(x.name)+'</option>').join('');[buyer,product,farmFilter,statusFilter].forEach(x=>x.onchange=renderOrders);renderOrders();renderFarms();renderPickup();renderDebt()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));(async()=>{try{const x=await api('ture?order=datum.desc,id.desc&limit=1');tour=x?.[0];if(!tour)throw Error('Нема туре');await reload()}catch(x){document.getElementById('tourTitle').textContent='Грешка';document.getElementById('status').textContent=x.message}})();
</script></body></html>
