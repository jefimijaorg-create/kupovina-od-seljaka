<!doctype html>
<html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Припрема испоруке по производима</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Arial,sans-serif}button:focus-visible{outline:3px solid #10b981;outline-offset:2px}</style></head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<header class="bg-emerald-800 text-white sticky top-0 z-20 shadow"><div class="max-w-6xl mx-auto p-4"><div class="flex items-center justify-between gap-3 flex-wrap"><div><p class="text-emerald-200 text-xs font-bold">НАРУЧИ ДОМАЋЕ · ОПЕРАТИВА</p><h1 class="text-xl sm:text-2xl font-black">Припрема испоруке по производима</h1><p class="text-sm text-emerald-100">Производ → паковање → купац</p></div><button onclick="loadTour()" class="bg-emerald-700 rounded-lg px-4 py-2 font-bold text-sm">Освежи</button></div></div></header>
<main class="max-w-6xl mx-auto p-3 sm:p-5">
<div id="message" class="bg-white border rounded-xl p-3 text-sm mb-4">Повезивање са базом…</div>
<div class="bg-white border rounded-xl p-4 mb-4"><label class="block text-xs font-bold text-slate-500">ИЗАБЕРИ ТУРУ<select id="tour" class="mt-1 w-full border rounded-lg p-3 text-base" onchange="loadTour()"></select></label><div id="stats" class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-3"></div></div>
<div class="grid md:grid-cols-[minmax(220px,0.8fr)_minmax(0,2fr)] gap-4">
<section class="bg-white border rounded-xl p-3 sm:p-4"><div class="flex justify-between items-center gap-2"><h2 class="font-black text-lg">Производи</h2><span id="product-count" class="text-xs text-slate-500"></span></div><p class="text-xs text-slate-500 mb-3">Приказују се само производи који постоје у поруџбинама ове туре.</p><div id="products" class="space-y-2"></div></section>
<section class="bg-white border rounded-xl p-3 sm:p-4 min-h-64"><div id="detail"><p class="text-slate-500 text-sm">Изабери производ са леве стране.</p></div></section>
</div></main>
<script>
const URL='https://kszkehxrcuagymlfowqj.supabase.co',KEY='sb_publishable_TRZp6skXsdIUsE4Vl65_2Q_QskFb532',H={apikey:KEY,'Content-Type':'application/json'};
let tours=[],items=[],orders=[],customers=[],selectedProduct='',selectedPack='';
const $=id=>document.getElementById(id),num=v=>Number(v||0),fmt=v=>num(v).toLocaleString('sr-RS',{maximumFractionDigits:3}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path){const r=await fetch(URL+'/rest/v1/'+path,{headers:H});const t=await r.text();if(!r.ok)throw Error(t||r.statusText);return t?JSON.parse(t):[]}
function order(x){return orders.find(o=>String(o.id)===String(x.porudzbina_id))||{}}
function buyer(o){return customers.find(c=>String(c.id)===String(o.kupac_id))||{}}
function packageOf(x){
 let count=num(x.package_count)||num(x.broj_pakovanja),size=num(x.package_size),unit=String(x.package_unit||x.quantity_unit||x.jedinica||'ком').toLowerCase();
 unit=({l:'л',kg:'кг',kom:'ком',pcs:'ком',g:'г'})[unit]||unit;
 const raw=String(x.package_info||x.velicina_pakovanja||x.variant_name||'');
 if(!size){const m=raw.match(/(\d+(?:[.,]\d+)?)\s*(л|l|кг|kg|г|g|ком)/i);if(m){size=parseFloat(m[1].replace(',','.'));unit=({'l':'л','л':'л','kg':'кг','кг':'кг','g':'г','г':'г','ком':'ком'})[m[2].toLowerCase()]||unit}}
 if(!count&&size)count=num(x.total_quantity||x.kolicina)/size;
 if(!size&&count)size=num(x.total_quantity||x.kolicina)/count;
 if(!count)count=num(x.kolicina||x.total_quantity);
 const label=fmt(size)+' '+unit;
 return {count,size,unit,label,total:count*size,key:fmt(size)+'|'+unit};
}
function valid(x){return !['otkazano','отказано','cancelled','canceled','obrisano','deleted'].includes(String(x.status||'').toLowerCase())&&!['otkazano','отказано','cancelled','canceled','obrisano','deleted'].includes(String(x.status_stavke||'').toLowerCase())}
function groups(){const out={};items.filter(valid).forEach(x=>{const name=String(x.proizvod||'Непознат производ').trim(),p=packageOf(x);if(!out[name])out[name]={name,rows:[],packs:{},count:0};const g=out[name];g.rows.push(x);g.count+=p.count;if(!g.packs[p.key])g.packs[p.key]={...p,rows:[]};g.packs[p.key].count+=p.count;g.packs[p.key].rows.push(x)});return Object.values(out).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name,'sr'))}
function say(t,bad=false){$('message').textContent=t;$('message').className='border rounded-xl p-3 text-sm mb-4 '+(bad?'bg-red-50 border-red-200 text-red-700':'bg-emerald-50 border-emerald-200 text-emerald-800')}
async function init(){try{const [t,o,c]=await Promise.all([api('ture?select=id,naziv,datum,status&order=datum.desc&limit=300'),api('porudzbine?select=id,kupac_id,telefon,punkt_id,napomena&limit=3000'),api('kupci?select=id,ime_prezime,telefon')]);tours=t;orders=o;customers=c;const s=$('tour');s.innerHTML=tours.map(t=>'<option value="'+t.id+'">'+esc(t.naziv||'Тура '+t.id)+' · '+esc(t.datum||'')+'</option>').join('');if(tours.length)await loadTour();else say('Нема евидентираних тура.',true)}catch(e){say('Грешка при учитавању: '+e.message,true)}}
async function loadTour(){try{const id=$('tour').value;if(!id)return;items=await api('stavke_porudzbine?select=*&tura_id=eq.'+id+'&order=id.asc');selectedProduct='';selectedPack='';render();say('Учитавање завршено · '+items.filter(valid).length+' ставки у овој тури.')}catch(e){say('Не могу да учитам туру: '+e.message,true)}}
function render(){const gs=groups();$('product-count').textContent=gs.length+' производа';$('stats').innerHTML='<div class="bg-emerald-50 rounded-lg p-3"><div class="text-xs text-emerald-700">ПРОИЗВОДА</div><b class="text-2xl">'+gs.length+'</b></div><div class="bg-blue-50 rounded-lg p-3"><div class="text-xs text-blue-700">СТАВКИ</div><b class="text-2xl">'+items.filter(valid).length+'</b></div><div class="bg-amber-50 rounded-lg p-3 col-span-2 sm:col-span-1"><div class="text-xs text-amber-700">УКУПНО ПАКОВАЊА</div><b class="text-2xl">'+fmt(items.filter(valid).reduce((a,x)=>a+packageOf(x).count,0))+'</b></div>';
 $('products').innerHTML=gs.map(g=>'<button onclick="chooseProduct('+JSON.stringify(g.name).replace(/"/g,'&quot;')+')" class="w-full text-left rounded-xl border p-3 flex items-center justify-between gap-2 '+(selectedProduct===g.name?'bg-emerald-50 border-emerald-500':'bg-white hover:bg-slate-50')+'"><span class="font-bold">'+esc(g.name)+'</span><span class="shrink-0 rounded-full bg-slate-100 px-2 py-1 text-xs font-black">'+fmt(g.count)+' пак.</span></button>').join('')||'<p class="text-sm text-slate-500">Нема производа за испоруку у овој тури.</p>';
 if(selectedProduct)renderDetail();else $('detail').innerHTML='<p class="text-slate-500 text-sm">Изабери производ да видиш паковања и купце.</p>'}
function chooseProduct(name){selectedProduct=name;selectedPack='';render()}
function renderDetail(){const g=groups().find(x=>x.name===selectedProduct);if(!g){$('detail').innerHTML='';return}const packs=Object.values(g.packs).sort((a,b)=>b.count-a.count||a.size-b.size);$('detail').innerHTML='<h2 class="text-xl font-black">'+esc(g.name)+'</h2><p class="text-sm text-slate-500 mt-1">'+fmt(g.count)+' паковања · '+fmt(g.rows.length)+' поруџбина/ставки</p><h3 class="font-bold mt-5 mb-2">Изабери величину паковања</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-2">'+packs.map(p=>'<button onclick="choosePack('+JSON.stringify(p.key).replace(/"/g,'&quot;')+')" class="text-left border rounded-xl p-3 '+(selectedPack===p.key?'border-emerald-500 bg-emerald-50':'hover:bg-slate-50')+'"><div class="font-black text-lg">'+fmt(p.count)+' × '+esc(p.label)+'</div><div class="text-sm text-slate-500">Укупно: '+fmt(p.total)+' '+esc(p.unit)+'</div><div class="text-xs text-emerald-700 mt-1">Кликни да видиш за кога је</div></button>').join('')+'</div>'+(selectedPack?renderBuyers(g.packs[selectedPack]):'<p class="text-sm text-slate-500 mt-5">Изабери паковање да се прикажу купци и њихове количине.</p>')}
function choosePack(key){selectedPack=key;renderDetail()}
function renderBuyers(p){const rows=p.rows.slice().sort((a,b)=>String(a.porudzbina_id).localeCompare(String(b.porudzbina_id),undefined,{numeric:true}));return '<div class="mt-5 border-t pt-4"><div class="flex flex-wrap justify-between gap-2 items-center"><h3 class="font-black text-lg">Ко је наручио: '+esc(p.label)+'</h3><b class="text-emerald-800">'+fmt(p.count)+' паковања укупно</b></div><div class="space-y-2 mt-3">'+rows.map(x=>{const o=order(x),b=buyer(o),pk=packageOf(x),name=b.ime_prezime||'Купац из поруџбине #'+x.porudzbina_id,phone=b.telefon||o.telefon||'';return '<article class="border rounded-xl p-3"><div class="flex flex-wrap justify-between gap-2"><div><div class="font-bold">'+esc(name)+'</div><div class="text-sm text-slate-500">'+(phone?esc(phone)+' · ':'')+'Поруџбина #'+esc(x.porudzbina_id)+'</div><div class="text-sm mt-1">'+fmt(pk.count)+' × '+esc(pk.label)+' = <b>'+fmt(pk.total)+' '+esc(pk.unit)+'</b></div></div><div class="text-right text-xs text-slate-500">'+esc(o.napomena||'')+'</div></div></article>'}).join('')+'</div></div>'}
init();
</script></body></html>
