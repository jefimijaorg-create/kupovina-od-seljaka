<!doctype html>

<body><header class="bg-slate-900 text-white"><div class="max-w-7xl mx-auto px-4 py-5 flex flex-wrap items-center justify-between gap-3"><div><div class="text-xs uppercase tracking-widest text-emerald-300 font-extrabold">Наручи домаће из Велике Плане</div><h1 class="text-2xl md:text-3xl font-black mt-1">Преглед туре</h1><p class="text-slate-300 text-sm mt-1">Одвојени прикази: преузимање и достава</p></div><div class="flex gap-2"><button class="btn bg-white/10" onclick="loadData()">↻ Освежи</button><button class="btn bg-emerald-400 text-slate-950" onclick="window.print()">Штампај</button></div></div></header>

async function api(path,opts){opts=opts||{};var r=await fetch(U+'/rest/v1/'+path,Object.assign({},opts,{headers:Object.assign({},H,opts.headers||{})}));var tx=await r.text();if(!r.ok)throw Error(tx||r.statusText);return tx?JSON.parse(tx):[]}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function n(v){return Number(v||0)}
function pack(x){var count=n(x.package_count||x.broj_pakovanja),size=n(x.package_size),unit=x.package_unit||x.quantity_unit||x.jedinica||'ком',label=x.package_info||x.velicina_pakovanja||x.variant_name||'';label=String(label).replace(/^\s*\d+(?:[.,]\d+)?\s*[×x]\\s*/i,'').trim();if(!size){var m=String(label||x.proizvod||'').match(/(\d+(?:[.,]\d+)?)\s*(литара|литра|л|kg|кг|g|гр|ком)/i);if(m){size=parseFloat(m[1].replace(',','.'));unit=/kg|кг/i.test(m[2])?'кг':/g|гр/i.test(m[2])?'г':/ком/i.test(m[2])?'ком':'л'}}if(!count){var q=n(x.kolicina);count=size?q/size:q}if(!size)size=1;return {count:count,size:size,unit:unit,label:label||size+' '+unit,total:n(x.total_quantity)||n(x.kolicina)||count*size}}
function packText(x){var p=pack(x);return p.count+' × '+p.label+' = '+p.total.toLocaleString('sr-RS')+' '+p.unit}function basePackLabel(x){var p=pack(x);return String(p.label||'').replace(/^\s*\d+(?:[.,]\d+)?\s*[×x]\\s*/i,'').trim()||((p.size||1)+' '+p.unit)}function money(v){return n(v).toLocaleString('sr-RS',{maximumFractionDigits:2})+' дин.'}
function order(x){return orders.find(function(o){return String(o.id)===String(x.porudzbina_id)})||{}}function cust(o){return customers.find(function(c){return String(c.id)===String(o.kupac_id)})||{}}function point(x){var o=order(x);return points.find(function(p){return String(p.id)===String(o.punkt_id)})||{}}function farm(x){return x.dodijeljeno_gazdinstvo_id?farms.find(function(f){return String(f.id)===String(x.dodijeljeno_gazdinstvo_id)})||null:null}
function msg(t,bad){var e=document.getElementById('message');e.textContent=t;e.className='card p-3 text-sm '+(bad?'text-red-700':'text-emerald-800')}
async function loadData(){try{msg('Учитавање из Supabase базе…');var d=await Promise.all([api('ture?select=id,naziv,datum,status&order=datum.desc.nullslast&order=id.desc&limit=200'),api('gazdinstva?select=id,name&order=name.asc'),api('punktovi?select=id,name,city,address&order=name.asc'),api('porudzbine?select=id,kupac_id,status,ukupna_cena,telefon,punkt_id,adresa_dostave&limit=2000'),api('kupci?select=id,ime_prezime,telefon'),api('tura_punktovi?select=tura_id,punkt_id,redosled,aktivan,vreme')]);tours=d[0];farms=d[1];points=d[2];orders=d[3];customers=d[4];tourPoints=d[5];var s=document.getElementById('tour'),prior=s.value||String(selected);s.innerHTML=tours.map(function(t){return '<option value="'+t.id+'">'+esc(t.naziv||'Тура '+t.id)+' · '+esc(t.datum||'')+'</option>'}).join('');s.value=tours.some(function(t){return String(t.id)===prior})?prior:(tours.some(function(t){return String(t.id)==='68'})?'68':String(tours[0]&&tours[0].id||''));await loadTour()}catch(e){msg('Грешка при повезивању: '+e.message,true)}}
async function loadTour(){try{selected=Number(document.getElementById('tour').value||68);items=await api('stavke_porudzbine?select=*&tura_id=eq.'+selected+'&order=id.asc');render();msg('Повезано са базом · тура '+selected+' · учитано '+items.length+' ставки.')}catch(e){msg('Грешка при учитавању ставki: '+e.message,true)}}
function showView(view){var p=document.getElementById('pickupSection'),d=document.getElementById('deliverySection'),bp=document.getElementById('tabPickup'),bd=document.getElementById('tabDelivery');p.classList.toggle('hidden',view!=='pickup');d.classList.toggle('hidden',view!=='delivery');bp.className='btn '+(view==='pickup'?'bg-blue-700 text-white':'bg-white text-slate-700 border');bd.className='btn '+(view==='delivery'?'bg-emerald-600 text-white':'bg-white text-slate-700 border')}
function render(){var s=document.getElementById('search').value.trim().toLocaleLowerCase('sr'),list=items.filter(function(x){if(!s)return true;var o=order(x),c=cust(o),p=point(x),f=farm(x);return [x.proizvod,x.variant_name,x.package_info,c.ime_prezime,c.telefon,o.telefon,p.name,f&&f.name].join(' ').toLocaleLowerCase('sr').includes(s)});document.getElementById('summary').textContent=list.length+' ставки · '+new Set(list.map(function(x){return x.porudzbina_id})).size+' поруџбина';var groups={};list.forEach(function(x){var f=farm(x),k=f?String(f.id):'none';if(!groups[k])groups[k]={farm:f,items:[]};groups[k].items.push(x)});document.getElementById('pickupCount').textContent=list.length+' ставки';
document.getElementById('pickup').innerHTML=Object.keys(groups).sort(function(a,b){return a==='none'?-1:b==='none'?1:String(groups[a].farm&&groups[a].farm.name||'').localeCompare(String(groups[b].farm&&groups[b].farm.name||''),'sr')}).map(function(k){var g=groups[k],ordersById={};g.items.forEach(function(x){var oid=String(x.porudzbina_id);if(!ordersById[oid])ordersById[oid]=[];ordersById[oid].push(x)});return '<article class="card p-4"><div class="flex justify-between items-start mb-3"><div><h3 class="font-black text-lg">'+(g.farm?esc(g.farm.name):'⚠️ НЕДОДЕЉЕНО ГАЗДИНСТВО')+'</h3><p class="text-xs muted">'+g.items.length+' ставки · '+Object.keys(ordersById).length+' поруџбина</p></div><span class="pill '+(g.farm?'bg-blue-100 text-blue-800':'bg-red-100 text-red-800')+'">'+(g.farm?g.items.reduce(function(a,x){return a+pack(x).count},0)+' паковања':'НИЈЕ ПРЕУЗЕТО')+'</span></div>'+Object.keys(ordersById).map(function(oid){var its=ordersById[oid],o=order(its[0]),cu=cust(o),hasUnassigned=its.some(function(x){return !farm(x)});return '<div class="border rounded-xl p-3 mb-3 last:mb-0"><div class="flex flex-wrap justify-between gap-2 mb-2"><div><b>'+esc(cu.ime_prezime||'Поруџбина '+oid)+'</b><div class="text-xs muted">Поруџбина #'+oid+' · '+esc(o.telefon||cu.telefon||'')+'</div></div><div class="text-right"><div class="font-black">'+money(its.reduce(function(a,x){return a+n(x.cena_stavke)},0))+'</div><div class="text-xs '+(hasUnassigned?'text-red-600':'text-emerald-700')+'">'+(hasUnassigned?'⚠️ Има недодељених ставки':'Газдинство додељено')+'</div></div></div>'+its.map(function(x){var p=pack(x),f=farm(x),label=basePackLabel(x),price=n(x.unit_price)|| (n(x.kolicina)?n(x.cena_stavke)/n(x.kolicina):0),unit=x.package_unit||x.quantity_unit||x.jedinica||'ком';return '<div class="item"><div class="flex flex-wrap justify-between gap-2"><b>'+esc(x.proizvod||x.variant_name||'Производ')+'</b><span class="font-extrabold">'+money(x.cena_stavke)+'</span></div><div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-2"><label class="text-xs muted">Број паковања<input id="pc'+x.id+'" type="number" min="0" step="1" class="input w-full" value="'+p.count+'" onchange="previewLine('+x.id+')"></label><label class="text-xs muted">Количина у паковању ('+esc(unit)+')<input id="ps'+x.id+'" type="number" min="0.01" step="any" class="input w-full" value="'+p.size+'" onchange="previewLine('+x.id+')"></label><label class="text-xs muted col-span-2">Назив паковања<input id="pl'+x.id+'" class="input w-full" value="'+esc(label)+'" oninput="previewLine('+x.id+')"></label></div><div id="preview'+x.id+'" class="text-sm font-bold mt-2">'+p.count+' × '+esc(label)+' = '+p.total.toLocaleString('sr-RS')+' '+esc(unit)+' · '+money(x.cena_stavke)+'</div><div class="flex flex-wrap gap-2 items-center mt-2"><label class="text-xs muted">Газдинство<select id="farm'+x.id+'" class="input" onchange="assignFarm('+x.id+',this.value)"><option value="">⚠️ Недодељено</option>'+farms.map(function(ff){return '<option value="'+ff.id+'" '+(String(ff.id)===String(x.dodijeljeno_gazdinstvo_id||x.gazdinstvo_id)?'selected':'')+'>'+esc(ff.name)+'</option>'}).join('')+'</select></label><label class="text-xs muted">Преузето (паковања)<span class="block text-base font-black '+(!f?'text-red-600':'')+'">'+(f?n(x.preuzeta_kolicina):0)+' ком.</span></label><button class="btn bg-slate-800 text-white" onclick="savePackage('+x.id+')">Сачувај паковање и цену</button></div></div>'}).join('')+'<button class="btn w-full mt-2 '+(hasUnassigned?'bg-slate-200 text-slate-600':'bg-emerald-600 text-white')+'" onclick="markOrderPicked('+oid+','+JSON.stringify(its.map(function(x){return x.id}))+')">✓ Преузето за ову поруџбину</button>'+(hasUnassigned?'<p class="text-xs text-red-600 mt-2">Ставке без газдинства остају на 0 ком. и не могу се означити као преузете.</p>':'')+'</div>'}).join('')+'</article>'}).join('')||'<div class="card p-5 muted">Нема ставки за ову туру.</div>';

var byPoint={};list.forEach(function(x){var k=String(order(x).punkt_id||'none');if(!byPoint[k])byPoint[k]={point:point(x),orders:{}};var oid=String(x.porudzbina_id);if(!byPoint[k].orders[oid])byPoint[k].orders[oid]=[];byPoint[k].orders[oid].push(x)});var seq=tourPoints.filter(function(x){return Number(x.tura_id)===selected&&x.aktivan}).sort(function(a,b){return n(a.redosled)-n(b.redosled)}).map(function(x){return String(x.punkt_id)});var keys=Object.keys(byPoint).sort(function(a,b){if(a==='none')return 1;if(b==='none')return -1;var ia=seq.indexOf(a),ib=seq.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib)});document.getElementById('deliveryCount').textContent=keys.length+' пунктова';
document.getElementById('delivery').innerHTML=keys.map(function(k){var g=byPoint[k],ids=Object.keys(g.orders);return '<article class="card p-4"><div class="flex justify-between items-center border-b pb-3 mb-2"><div><h3 class="font-black text-lg">'+esc(g.point.name||'Без пункта')+'</h3><p class="text-xs muted">'+esc(g.point.address||g.point.city||'')+'</p></div><span class="pill bg-emerald-100 text-emerald-800">'+ids.length+' поруџбина</span></div>'+ids.map(function(oid){var its=g.orders[oid],o=order(its[0]),c=cust(o);return '<div class="item"><div class="flex flex-wrap justify-between gap-2"><b>'+esc(c.ime_prezime||'Купац '+oid)+'</b><span class="text-sm">'+esc(o.telefon||c.telefon||'')+'</span></div><div class="text-xs muted mb-2">'+esc(o.adresa_dostave||'')+'</div>'+its.map(function(x){return '<div class="text-sm py-1 flex flex-wrap items-center justify-between gap-2"><span>'+esc(x.proizvod||x.variant_name)+'</span><b>'+esc(packText(x))+'</b><label class="text-xs muted">Испоручено <input id="del'+x.id+'" type="number" min="0" step="any" class="input w-20" value="'+n(x.isporucena_kolicina)+'"></label><button class="btn bg-slate-800 text-white" onclick="saveQty('+x.id+',\'isporucena_kolicina\',\'del'+x.id+'\')">Сачувај</button></div>'}).join('')+'</div>'}).join('')+'</article>'}).join('')||'<div class="card p-5 muted">Нема поруџбина за ову туру.</div>'}
function previewLine(id){var x=items.find(function(i){return Number(i.id)===Number(id)});if(!x)return;var count=Math.max(0,n(document.getElementById('pc'+id).value)),size=Math.max(0,n(document.getElementById('ps'+id).value)),label=document.getElementById('pl'+id).value||size+' '+(x.package_unit||x.quantity_unit||x.jedinica||'ком'),unit=x.package_unit||x.quantity_unit||x.jedinica||'ком',total=count*size,price=n(x.unit_price)||(n(x.kolicina)?n(x.cena_stavke)/n(x.kolicina):0);document.getElementById('preview'+id).textContent=count+' × '+label+' = '+total.toLocaleString('sr-RS')+' '+unit+' · '+money(total*price)}
async function savePackage(id){try{var x=items.find(function(i){return Number(i.id)===Number(id)});if(!x)throw Error('Ставка није пронађена');var count=Math.max(0,n(document.getElementById('pc'+id).value)),size=Math.max(0,n(document.getElementById('ps'+id).value)),label=(document.getElementById('pl'+id).value||'Паковање').trim(),unit=x.package_unit||x.quantity_unit||x.jedinica||'ком';if(size<=0)throw Error('Количина у паковању мора бити већа од нуле');var total=count*size,price=n(x.unit_price)||(n(x.kolicina)?n(x.cena_stavke)/n(x.kolicina):0),sum=total*price,info=count+' × '+label,patch={package_count:count,broj_pakovanja:Math.round(count),package_size:size,package_info:info,velicina_pakovanja:info,total_quantity:total,kolicina:total,cena_stavke:sum};if(!farm(x))patch.preuzeta_kolicina=0;await api('stavke_porudzbine?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(patch)});Object.assign(x,patch);var oid=String(x.porudzbina_id),ord=orders.find(function(o){return String(o.id)===oid});if(ord){var orderSum=items.filter(function(i){return String(i.porudzbina_id)===oid}).reduce(function(a,i){return a+n(i.cena_stavke)},0);await api('porudzbine?id=eq.'+oid,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({ukupna_cena:orderSum})});ord.ukupna_cena=orderSum}msg('Паковање, количина и цена су сачувани.');render()}catch(e){msg('Измена није сачувана: '+e.message,true)}}
async function markOrderPicked(orderId,ids){try{var list=items.filter(function(x){return String(x.porudzbina_id)===String(orderId)});var unassigned=list.filter(function(x){return !farm(x)});for(var i=0;i<list.length;i++){var x=list[i],qty=farm(x)?pack(x).count:0;await api('stavke_porudzbine?id=eq.'+x.id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({preuzeta_kolicina:qty})});x.preuzeta_kolicina=qty}msg(unassigned.length?'Означено преузимање додељених ставки; недодељене ставке су остале на 0 ком.':'Цела поруџбина је означена као преузета.');render()}catch(e){msg('Преузимање није сачувано: '+e.message,true)}}
async function saveQty(id,field,inputId){try{var value=n(document.getElementById(inputId).value);await api('stavke_porudzbine?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({[field]:value})});var x=items.find(function(i){return String(i.id)===String(id)});if(x)x[field]=value;msg('Измена је сачувана у бази.');render()}catch(e){msg('Није сачувано: '+e.message,true)}}
async function assignFarm(id,val){try{var patch={dodijeljeno_gazdinstvo_id:val?Number(val):null,gazdinstvo_id:val?Number(val):null};if(!val)patch.preuzeta_kolicina=0;await api('stavke_porudzbine?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(patch)});var x=items.find(function(i){return String(i.id)===String(id)});if(x)Object.assign(x,patch);msg('Газдинство је сачувано у бази.');render()}catch(e){msg('Додела није сачувана: '+e.message,true);render()}}
showView('pickup');loadData();
</script></body></html>
