<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Наручи домаће</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:light;--green:#166534;--line:#e5e7eb;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:#f3f5f4;color:#17211b;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#14532d;color:white;padding:18px max(16px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:21px;margin:0}main{max-width:1100px;margin:auto;padding:18px 14px 60px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #0f172a08}.login{max-width:430px;margin:7vh auto}.fields{display:flex;gap:9px;flex-wrap:wrap}input,select,button{font:inherit;border-radius:10px;padding:10px 12px;border:1px solid #cbd5e1;background:white}input{min-width:0;flex:1}button{cursor:pointer;font-weight:700}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.5;cursor:wait}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:13px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:22px}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.stop{margin:14px 0 8px;font-size:17px;font-weight:800}.order{border:1px solid var(--line);border-radius:13px;padding:13px;margin:8px 0;background:white}.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.name{font-weight:800;font-size:16px}.muted{color:var(--muted);font-size:13px}.items{margin:8px 0;padding-left:19px}.items li{margin:3px 0}.amount{font-weight:900;white-space:nowrap}.pill{display:inline-block;border-radius:999px;padding:3px 9px;background:#ecfdf5;color:#166534;font-size:12px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.error{color:#b91c1c}.hidden{display:none!important}.empty{padding:20px;text-align:center;color:var(--muted)}footer{font-size:12px;color:var(--muted);text-align:center;margin:22px 0}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.order-head{display:block}.amount{display:block;margin-top:5px}}@media print{header,.toolbar,.actions,.login,footer,.no-print{display:none!important}body{background:white}main{max-width:none;padding:0}.panel,.order{box-shadow:none;border-color:#bbb;break-inside:avoid}.stop{break-after:avoid}}
</style></head>
<body>
<header><div><h1>Наручи домаће — Admin</h1><div style="opacity:.85;font-size:13px">Туре, поруџбине и испоруке</div></div><button id="logout" class="hidden">Одјава</button></header>
<main>
<section id="loginPanel" class="panel login"><h2>Пријава администратора</h2><p class="muted">Пријави се Supabase налогом администратора.</p><form id="loginForm"><div class="fields" style="margin:10px 0"><input id="email" type="email" autocomplete="username" placeholder="Е-пошта" required></div><div class="fields" style="margin:10px 0"><input id="password" type="password" autocomplete="current-password" placeholder="Лозинка" required></div><button class="primary" type="submit">Пријави се</button><p id="loginError" class="error"></p></form></section>
<section id="app" class="hidden">
<div class="panel"><div class="fields" style="justify-content:space-between;align-items:center"><div><strong id="tourTitle">Учитавање туре…</strong><div id="tourDate" class="muted"></div></div><button id="refresh" class="primary">Освежи податке</button></div></div>
<div class="panel stats"><div class="stat"><small>Поруџбине</small><strong id="count">—</strong></div><div class="stat"><small>Укупно</small><strong id="sum">—</strong></div><div class="stat"><small>Пунктови</small><strong id="stopsCount">—</strong></div></div>
<div class="panel"><div class="toolbar"><input id="search" placeholder="Претрага: купац, производ, телефон…"><select id="stopFilter"><option value="">Сви пунктови</option></select><select id="statusFilter"><option value="">Сви статуси</option><option value="new">Нова</option><option value="confirmed">Потврђена</option><option value="delivered">Испоручена</option><option value="cancelled">Отказана</option></select></div><div class="actions"><button id="copy">Копирај списак</button><button id="print">Штампај / PDF</button></div></div>
<div id="orders"></div><p id="message" class="muted"></p>
</section>
<footer>Приступ је преко Supabase Auth налога. Не дели администраторску лозинку.</footer>
</main>
<script>
const URL='https://kszkehxrcuagymlfowqj.supabase.co';
const KEY='sb_publishable_TRZp6skXsdIUsE4Vl65_2Q_QskFb532';
const sb=window.supabase.createClient(URL,KEY);
let tour=null, orders=[], points=[], items=[];
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('sr-RS',{maximumFractionDigits:2}).format(Number(n)||0)+' дин.';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say=t=>$('message').textContent=t;
async function authState(){const {data:{session}}=await sb.auth.getSession();$('loginPanel').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);$('logout').classList.toggle('hidden',!session);if(session)await load();}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginError').textContent='Пријава није успела: '+error.message;return;}await authState();});
$('logout').onclick=async()=>{await sb.auth.signOut();await authState();};
$('refresh').onclick=load;$('search').addEventListener('input',render);$('stopFilter').onchange=render;$('statusFilter').onchange=render;$('print').onclick=()=>window.print();
$('copy').onclick=async()=>{const text=makeText(filtered());try{await navigator.clipboard.writeText(text);say('Списак је копиран.');}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();say('Списак је копиран.');}};
async function load(){
 say('Учитавање…');
 try{
  const [{data:ts,error:te},{data:os,error:oe},{data:is,error:ie},{data:ps,error:pe}]=await Promise.all([
   sb.from('ture').select('id,naziv,datum,status').eq('id',66).limit(1),
   sb.from('porudzbine').select('id,kupac_id,status,ukupna_cena,napomena,adresa_dostave,telefon,punkt_id,dostavljac,created_at').order('id'),
   sb.from('stavke_porudzbine').select('id,porudzbina_id,proizvod,kolicina,jedinica,cena_stavke,tura_id,variant_name,package_count,package_size,package_unit,total_quantity,quantity_unit,status_stavke'),
   sb.from('punktovi').select('id,name,city,address,vreme,aktivan,is_active').limit(500)
  ]);
  if(te||oe||ie||pe)throw te||oe||ie||pe;
  tour=ts?.[0];if(!tour)throw new Error('Тура 66 није пронађена.');
  const tourOrderIds=new Set((is||[]).filter(i=>String(i.tura_id)==String(tour.id)).map(i=>String(i.porudzbina_id)));
  items=(is||[]).filter(i=>String(i.tura_id)==String(tour.id));
  orders=(os||[]).filter(o=>tourOrderIds.has(String(o.id)));
  points=ps||[];
  $('tourTitle').textContent=tour.naziv||'Тура '+tour.id;
  $('tourDate').textContent=new Date(tour.datum+'T12:00:00').toLocaleDateString('sr-RS',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · ID '+tour.id;
  const prev=$('stopFilter').value;
  $('stopFilter').innerHTML='<option value="">Сви пунктови</option>'+[...new Set(orders.map(o=>String(o.punkt_id||'')))].filter(Boolean).map(id=>{const p=points.find(p=>String(p.id)===id);return '<option value="'+esc(id)+'">'+esc(p?.name||oLabel(id))+'</option>';}).join('');
  $('stopFilter').value=prev;
  $('count').textContent=orders.length;
  $('sum').textContent=money(orders.reduce((s,o)=>s+Number(o.ukupna_cena||0),0));
  $('stopsCount').textContent=new Set(orders.map(o=>String(o.punkt_id||'')).filter(Boolean)).size;
  render();say('Подаци су учитани.');
 }catch(e){say('Грешка при учитавању: '+(e.message||e));}
}
function oLabel(id){return 'Пункт '+id;}
function pointName(id){const p=points.find(p=>String(p.id)===String(id));return p?.name||('Пункт '+id);}
function pointTime(id){const p=points.find(p=>String(p.id)===String(id));return p?.vreme||'';}
function customerName(o){return o.kupac?.ime_prezime||o.ime_prezime||'Купац #'+o.kupac_id;}
function enriched(){return orders.map(o=>({...o,kupac:null,lines:items.filter(i=>String(i.porudzbina_id)===String(o.id))}));}
function filtered(){const q=$('search').value.trim().toLocaleLowerCase('sr');const stop=$('stopFilter').value,status=$('statusFilter').value;return enriched().filter(o=>(!stop||String(o.punkt_id)===stop)&&(!status||String(o.status||'new')===status)&&(!q||[o.kupac_id,o.telefon,o.adresa_dostave,o.napomena,o.status,...o.lines.map(i=>i.proizvod)].join(' ').toLocaleLowerCase('sr').includes(q))).sort((a,b)=>{const ta=pointTime(a.punkt_id),tb=pointTime(b.punkt_id);return ta.localeCompare(tb)||Number(a.punkt_id||0)-Number(b.punkt_id||0)||Number(a.id)-Number(b.id);});}
function makeText(rows){return (tour?.naziv||'Поруџбине')+'\n'+rows.map(o=>{const lines=o.lines.map(i=>'  • '+i.proizvod+': '+(i.total_quantity??i.kolicina)+' '+(i.quantity_unit||i.jedinica||'')+' — '+money(i.cena_stavke)).join('\n');return (pointTime(o.punkt_id)?pointTime(o.punkt_id)+' — ':'')+pointName(o.punkt_id)+'\nПоруџбина #'+o.id+' / купац #'+o.kupac_id+'\n'+(o.telefon||'')+'\n'+(o.adresa_dostave||'')+'\n'+lines+'\nУкупно: '+money(o.ukupna_cena)+'\nСтатус: '+(o.status||'new');}).join('\n\n');}
function render(){
 const rows=filtered();const groups=new Map();rows.forEach(o=>{const key=String(o.punkt_id||'0');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(o);});
 $('orders').innerHTML=rows.length?[...groups.entries()].map(([pid,arr])=>'<section><div class="stop">'+esc(pointTime(pid))+(pointTime(pid)?' — ':'')+esc(pointName(pid))+' <span class="muted">('+arr.length+')</span></div>'+arr.map(o=>{
 const customer='Купац #'+o.kupac_id;
 const lines=o.lines.map(i=>'<li><strong>'+esc(i.proizvod)+'</strong> — '+esc(i.total_quantity??i.kolicina)+' '+esc(i.quantity_unit||i.jedinica||'')+(i.variant_name?' · '+esc(i.variant_name):'')+' <span class="muted">('+money(i.cena_stavke)+')</span></li>').join('');
 const st=o.status||'new';const label={new:'Нова',confirmed:'Потврђена',delivered:'Испоручена',cancelled:'Отказана'}[st]||st;
 return '<article class="order"><div class="order-head"><div><div class="name">'+esc(customer)+' <span class="muted">#'+o.id+'</span></div><div class="muted">'+esc(o.telefon||'')+' · '+esc(o.adresa_dostave||'')+'</div></div><div class="amount">'+money(o.ukupna_cena)+'</div></div><ul class="items">'+(lines||'<li>Нема ставки</li>')+'</ul>'+(o.napomena?'<div class="muted">Напомена: '+esc(o.napomena)+'</div>':'')+'<div class="actions"><span class="pill">'+esc(label)+'</span><select data-status="'+o.id+'" aria-label="Статус поруџбине"><option value="new" '+(st==='new'?'selected':'')+'>Нова</option><option value="confirmed" '+(st==='confirmed'?'selected':'')+'>Потврђена</option><option value="delivered" '+(st==='delivered'?'selected':'')+'>Испоручена</option><option value="cancelled" '+(st==='cancelled'?'selected':'')+'>Отказана</option></select><button data-copy="'+o.id+'">Копирај поруџбину</button></div></article>';
 }).join('')+'</section>').join(''):'<div class="panel empty">Нема поруџбина за изабране филтере.</div>';
 $('orders').querySelectorAll('[data-status]').forEach(sel=>sel.onchange=()=>changeStatus(sel.dataset.status,sel.value,sel));
 $('orders').querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const o=rows.find(x=>String(x.id)===b.dataset.copy);try{await navigator.clipboard.writeText(makeText([o]));say('Поруџбина #'+o.id+' је копирана.');}catch(e){say('Копирање није доступно у овом прегледачу.');}});
}
async function changeStatus(id,status,control){control.disabled=true;say('Чување статуса…');try{const {error}=await sb.from('porudzbine').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;const o=orders.find(o=>String(o.id)===String(id));if(o)o.status=status;render();say('Статус поруџбине #'+id+' је сачуван.');}catch(e){control.disabled=false;say('Статус није сачуван: '+e.message);}}
sb.auth.onAuthStateChange(()=>{});authState();
</script></body></html>
