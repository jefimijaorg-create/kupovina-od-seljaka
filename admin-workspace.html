<!doctype html>
<!--
  NARUČI DOMAĆE — ADMIN WORKSPACE
  Version: 1.1.8
  Updated: 2026-11-17
  Description: Adds the procurement management panel entry point to the existing authenticated tour workspace.
  Scope: Existing authenticated ADMIN workspace; procurement writes are protected by RLS and a database trigger.
-->
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>ADMIN Workspace · Наручи домаће</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin.css?v=1.0.4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin/admin.js?v=1.0.1"></script>
</head>
<body class="nd-workspace">
<header class="nd-topbar">
  <button class="nd-icon-btn" id="menuBtn" type="button" aria-label="Otvori navigaciju" aria-expanded="false">☰</button>
  <div class="nd-brand"><span class="nd-brand-mark">⌂</span><span class="nd-brand-copy"><strong>NARUČI DOMAĆE</strong><small>ADMIN WORKSPACE</small></span></div>
  <span class="nd-status" id="activeTourStatus">TURA NIJE IZABRANA</span>
  <button class="nd-icon-btn nd-procurement-entry" id="procurementBtn" type="button" hidden>Набавка</button>
  <button class="nd-icon-btn" id="searchBtn" type="button" aria-label="Pretraga">⌕</button>
  <button class="nd-icon-btn" id="notificationsBtn" type="button" aria-label="Obaveštenja">♧</button>
  <span class="nd-user-label" id="userLabel">Provera naloga…</span>
  <button class="nd-icon-btn" id="userBtn" type="button" aria-label="Korisnički nalog">♙</button>
  <button class="nd-icon-btn" id="refreshBtn" type="button" aria-label="Osveži podatke">↻</button>
</header>
<div class="nd-layout">
  <aside class="nd-sidebar" aria-label="Glavna navigacija">
    <div class="nd-nav-label">RADNI PROSTOR</div>
    <nav class="nd-nav" id="desktopNav"></nav>
  </aside>
  <main class="nd-main">
    <div class="nd-page-head">
      <div><div class="nd-eyebrow">CENTRALNI ADMIN</div><h1>Kontrolna tabla</h1><p>Pregled aktivnog poslovanja i statusa tura.</p></div>
      <span class="nd-status" id="connectionStatus">POVEZIVANJE…</span>
    </div>
    <section class="nd-tour-grid" id="dashboardTours" aria-label="Pregled tura">
      <article class="nd-panel">
        <div class="nd-panel-head"><h2>Otvorene ture</h2><span class="nd-count" id="openCount">—</span></div>
        <div class="nd-tour-list" id="openTours" aria-live="polite"><div class="nd-loading">Učitavam otvorene ture iz baze…</div></div>
      </article>
      <article class="nd-panel">
        <div class="nd-panel-head"><h2>Ture u obradi</h2><span class="nd-count" id="processingCount">—</span></div>
        <div class="nd-tour-list" id="processingTours" aria-live="polite"><div class="nd-loading">Učitavam ture u obradi…</div></div>
      </article>
    </section>
    <section id="tourOperationsRoot" class="nd-tour-operations-root" hidden aria-live="polite"></section>
  </main>
</div>
<div class="nd-overlay" id="drawerOverlay" aria-hidden="true">
  <aside class="nd-drawer" role="dialog" aria-modal="true" aria-label="Glavna navigacija">
    <div class="nd-drawer-head"><strong>ADMIN MENI</strong><button class="nd-icon-btn" id="closeDrawer" type="button" aria-label="Zatvori meni">×</button></div>
    <nav class="nd-nav" id="mobileNav"></nav>
  </aside>
</div>
<div class="nd-overlay" id="dialogOverlay" aria-hidden="true">
  <section class="nd-dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div class="nd-panel-head"><h2 id="dialogTitle">Detalji</h2><button class="nd-icon-btn" id="closeDialog" type="button" aria-label="Zatvori">×</button></div>
    <div id="dialogContent"></div>
  </section>
</div>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://kszkehxrcuagymlfowqj.supabase.co';
const SUPABASE_KEY='sb_publishable_TRZp6skXsdIUsE4Vl65_2Q_QskFb532';
const LOGIN='/admin2.html';
const NAV=[['⌂','Dashboard'],['▤','Ture'],['▦','Proizvodi'],['♧','Proizvođači'],['▣','Porudžbine'],['⌖','Punktovi'],['⇢','Dostava'],['♙','Kupci'],['▥','Izveštaji']];
const $=id=>document.getElementById(id);
let client=null, currentUser=null, currentRole=null, tours=[], busy=false, tourPanel=null, activeTourId=null;
function dashboardVisible(show){$('dashboardTours').hidden=!show;$('tourOperationsRoot').hidden=show;$('dashboardTours').previousElementSibling.hidden=!show;$('procurementBtn').hidden=show||!['admin','super_admin'].includes(currentRole);if(show){$('activeTourStatus').textContent='TURA NIJE IZABRANA';activeTourId=null;localStorage.removeItem('naruci-domace-admin-tour-id');if(tourPanel){tourPanel.destroy();tourPanel=null}}}
async function mountTourOperationsView(tourId){const root=$('tourOperationsRoot');root.hidden=false;root.innerHTML='<div class="nd-loading">Otvaram operativni prikaz ture…</div>';try{const mod=await import('/admin/tour-operations-panel.js?v=1.0.0');if(activeTourId!==String(tourId))return;const core=window.NDAdmin.getContext();tourPanel=await mod.mountTourOperations({root,core,tourId,onBack:()=>dashboardVisible(true)});}catch(error){root.textContent='Operativni prikaz nije dostupan: '+(error.message||String(error));}}
async function openTour(tour){if(!tour||!tour.id)return;activeTourId=String(tour.id);localStorage.setItem('naruci-domace-admin-tour-id',activeTourId);$('activeTourStatus').textContent='TURA #'+activeTourId;dashboardVisible(false);$('procurementBtn').hidden=!['admin','super_admin'].includes(currentRole);if(tourPanel){tourPanel.destroy();tourPanel=null}await mountTourOperationsView(activeTourId);}
async function openProcurementPanel(){if(!activeTourId||!['admin','super_admin'].includes(currentRole))return;if(tourPanel){tourPanel.destroy();tourPanel=null}const root=$('tourOperationsRoot');root.hidden=false;root.innerHTML='<div class="nd-loading">Otvaram upravljanje nabavkom…</div>';try{const mod=await import('/admin/procurement-management-panel.js?v=1.0.9');if(!activeTourId)return;const core=window.NDAdmin.getContext();const selectedTourId=activeTourId;tourPanel=await mod.mountProcurementManagement({root,core,tourId:selectedTourId,onBack:()=>{if(tourPanel){tourPanel.destroy();tourPanel=null;}mountTourOperationsView(selectedTourId)}});}catch(error){root.textContent='Upravljanje nabavkom nije dostupno: '+(error.message||String(error));}}
function statusLabel(s){return s==='open'?'OTVORENA':s==='processing'?'U OBRADI':String(s||'BEZ STATUSA').toUpperCase()}
function dateLabel(v){if(!v)return 'Datum nije naveden';const d=new Date(v+'T12:00:00');return Number.isNaN(d.getTime())?'Datum nije naveden':d.toLocaleDateString('sr-RS',{day:'2-digit',month:'short',year:'numeric'})}
function renderNav(root){root.replaceChildren();NAV.forEach(([ico,label],i)=>{const b=document.createElement('button');b.type='button';b.innerHTML='<span aria-hidden="true">'+ico+'</span><span>'+label+'</span>';if(i===0)b.setAttribute('aria-current','page');b.addEventListener('click',()=>{if(i===0){closeDrawer();return}showDialog(label,'Ovaj modul nije deo prve celine. Biće povezan tek kada njegova funkcionalnost bude zasebno analizirana i odobrena.');closeDrawer()});root.appendChild(b)})}
function showDialog(title,message){$('dialogTitle').textContent=title;$('dialogContent').textContent='';const p=document.createElement('p');p.textContent=message;$('dialogContent').appendChild(p);$('dialogOverlay').classList.add('open');$('dialogOverlay').setAttribute('aria-hidden','false')}
function closeDialog(){$('dialogOverlay').classList.remove('open');$('dialogOverlay').setAttribute('aria-hidden','true')}
function openDrawer(){$('drawerOverlay').classList.add('open');$('drawerOverlay').setAttribute('aria-hidden','false');$('menuBtn').setAttribute('aria-expanded','true')}
function closeDrawer(){$('drawerOverlay').classList.remove('open');$('drawerOverlay').setAttribute('aria-hidden','true');$('menuBtn').setAttribute('aria-expanded','false')}
function renderTours(status,target,countId){const list=$(target),items=tours.filter(t=>t.status===status);$(countId).textContent=String(items.length);list.replaceChildren();if(!items.length){const e=document.createElement('div');e.className='nd-empty';e.textContent=status==='open'?'Trenutno nema otvorenih tura.':'Trenutno nema tura u obradi.';list.appendChild(e);return}items.forEach(t=>{const row=document.createElement('button');row.type='button';row.className='nd-tour-item';row.addEventListener('click',()=>openTour(t));const icon=document.createElement('span');icon.className='nd-tour-icon';icon.textContent='🧭';const copy=document.createElement('span');copy.className='nd-tour-copy';const name=document.createElement('strong');name.textContent=t.naziv||('Tura '+t.id);const meta=document.createElement('small');meta.textContent=dateLabel(t.datum)+' · #'+t.id+' · '+statusLabel(t.status);copy.append(name,meta);row.append(icon,copy);list.appendChild(row)})}
async function loadTours(){if(busy||!client)return;busy=true;$('refreshBtn').disabled=true;$('connectionStatus').textContent='UČITAVAM TURE…';$('connectionStatus').classList.remove('ok');try{const {data,error}=await client.from('ture').select('id,naziv,datum,status').order('datum',{ascending:false}).order('id',{ascending:false}).limit(300);if(error)throw Error('Supabase upit za ture nije uspeo: '+error.message);if(!Array.isArray(data))throw Error('Baza nije vratila ispravan spisak tura.');tours=data;renderTours('open','openTours','openCount');renderTours('processing','processingTours','processingCount');$('connectionStatus').textContent='SUPABASE POVEZAN · PODACI AŽURNI';$('connectionStatus').classList.add('ok')}catch(e){$('connectionStatus').textContent='GREŠKA PRI UČITAVANJU';$('openTours').textContent='Greška: '+(e.message||String(e));$('processingTours').textContent='Podaci nisu učitani.';console.error('[ADMIN Workspace] loadTours:',e)}finally{busy=false;$('refreshBtn').disabled=false}}
async function boot(){try{if(location.protocol!=='https:')throw Error('ADMIN mora biti otvoren preko HTTPS veze.');if(!window.supabase?.createClient)throw Error('Supabase SDK nije učitan.');client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const {data:{session},error}=await client.auth.getSession();if(error)throw error;if(!session?.access_token){$('connectionStatus').textContent='NEMA SESIJE';showDialog('Potrebna je prijava','Nema aktivne ADMIN sesije. Prijavi se kroz postojeću ADMIN prijavu, pa ponovo otvori ovaj Workspace.');return}const {data:{user},error:userError}=await client.auth.getUser();if(userError||!user)throw Error('Identitet korisnika nije potvrđen.');const {data:record,error:roleError}=await client.from('app_users').select('role,is_active,display_name,username').eq('auth_user_id',user.id).maybeSingle();if(roleError)throw roleError;const allowed=['super_admin','admin','operator','viewer'];if(!record||record.is_active!==true||!allowed.includes(record.role))throw Error('ADMIN приступ није одобрен.');currentUser=user;currentRole=record.role;const existingCore={authenticated:true,client, getState:()=>({user:currentUser,role:currentRole}), api:(rpcName,options={})=>client.rpc(rpcName,options)};window.NDAdmin.start(existingCore);$('userLabel').textContent=record.display_name||record.username||user.email||'ADMIN korisnik';$('connectionStatus').textContent='SUPABASE POVEZAN';$('connectionStatus').classList.add('ok');await loadTours();client.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT'||!s?.access_token)location.replace(LOGIN)})}catch(e){$('connectionStatus').textContent='PRISTUP NIJE POTVRĐEN';showDialog('ADMIN pristup nije dostupan',e.message+' Ako je sesija istekla, prijavi se kroz postojeću ADMIN prijavu.')}} 
renderNav($('desktopNav'));renderNav($('mobileNav'));
$('menuBtn').addEventListener('click',openDrawer);$('closeDrawer').addEventListener('click',closeDrawer);$('drawerOverlay').addEventListener('click',e=>{if(e.target===$('drawerOverlay'))closeDrawer()});
$('closeDialog').addEventListener('click',closeDialog);$('dialogOverlay').addEventListener('click',e=>{if(e.target===$('dialogOverlay'))closeDialog()});
$('refreshBtn').addEventListener('click',loadTours);
$('procurementBtn').addEventListener('click',openProcurementPanel);
$('searchBtn').addEventListener('click',()=>{const wrap=document.createElement('div');const input=document.createElement('input');input.className='nd-search';input.type='search';input.placeholder='Pretraga tura po nazivu ili broju…';input.setAttribute('aria-label','Pretraga tura');const results=document.createElement('div');results.className='nd-tour-list';results.style.marginTop='12px';function update(){const q=input.value.trim().toLocaleLowerCase('sr');results.replaceChildren();tours.filter(t=>(String(t.naziv||'').toLocaleLowerCase('sr').includes(q)||String(t.id).includes(q))).forEach(t=>{const p=document.createElement('p');p.className='nd-empty';p.textContent=(t.naziv||'Tura '+t.id)+' · '+statusLabel(t.status);results.appendChild(p)});if(!results.childNodes.length){const p=document.createElement('p');p.className='nd-empty';p.textContent='Nema rezultata u trenutno učitanim aktivnim turama.';results.appendChild(p)}}input.addEventListener('input',update);wrap.append(input,results);$('dialogTitle').textContent='Pretraga';$('dialogContent').replaceChildren(wrap);$('dialogOverlay').classList.add('open');$('dialogOverlay').setAttribute('aria-hidden','false');update();input.focus()});
$('notificationsBtn').addEventListener('click',()=>showDialog('Obaveštenja','U ovoj fazi nije povezan izvor obaveštenja. Ne prikazujemo lažne ili probne notifikacije.'));
$('userBtn').addEventListener('click',()=>showDialog('Korisnički nalog','Korisnik: '+(currentUser?.email||'nije potvrđen')+' · Uloga: '+(currentRole||'nepoznata')+'. Odjava se obavlja kroz postojeći ADMIN tok.'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeDialog()}});
boot();
})();
</script>
</body>
</html>
