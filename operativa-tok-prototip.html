<!doctype html>
<html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оператива — ток доставе</title>
<style>
:root{--ink:#18211b;--muted:#6d766f;--line:#e2e7e3;--bg:#f3f5f3;--soft:#f7f9f7;--green:#17633b;--greenbg:#e8f3eb;--red:#a33b25;--redbg:#fff0ec;--amber:#8b5b16;--amberbg:#fff7e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input{font:inherit}.top{background:var(--ink);color:#fff;padding:17px 0}.wrap{max-width:760px;margin:auto;padding:0 13px}.top h1{font-size:21px;margin:0}.top p{font-size:11px;color:#c5cec8;margin:4px 0 0}.tourbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 0}.tourbarin{display:flex;justify-content:space-between;align-items:center;gap:10px}.tourbar b{font-size:14px}.muted{color:var(--muted);font-size:11px}.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:13px 0;font-size:12px;color:var(--muted)}.crumb button{border:0;background:none;padding:0;color:var(--green);font-weight:800;cursor:pointer}.crumb strong{color:var(--ink)}.screen{padding-bottom:35px}.titleline{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin:5px 0 12px}.titleline h2{font-size:20px;margin:0}.titleline p{font-size:11px;color:var(--muted);margin:3px 0 0}.pill{display:inline-block;border-radius:30px;padding:5px 9px;font-size:10px;font-weight:900;background:#edf0ed;color:#4e5b52}.pill.green{background:var(--greenbg);color:var(--green)}.pill.red{background:var(--redbg);color:var(--red)}.pill.amber{background:var(--amberbg);color:var(--amber)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0}.stat,.card,.box{background:#fff;border:1px solid var(--line);border-radius:13px}.stat{padding:10px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:15px 0 8px}.sectionhead b{font-size:13px}.point,.person{padding:13px;margin:8px 0;cursor:pointer}.point:active,.person:active{transform:scale(.995)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pointname,.personname{font-size:15px;font-weight:950}.pointmeta,.personmeta{font-size:11px;color:var(--muted);margin-top:4px}.time{font-size:17px;font-weight:950;white-space:nowrap}.right{text-align:right}.bar{height:6px;background:#edf0ed;border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--green);border-radius:9px}.person{display:flex;align-items:center;justify-content:space-between;gap:10px}.avatar{width:37px;height:37px;border-radius:50%;display:grid;place-items:center;background:var(--greenbg);color:var(--green);font-weight:950;flex:0 0 auto}.personleft{display:flex;align-items:center;gap:10px;min-width:0}.personname{font-size:14px}.personmeta{line-height:1.4}.ordercard{padding:13px;margin:10px 0}.product{padding:11px 0;border-bottom:1px solid var(--line)}.product:last-child{border-bottom:0}.prodname{font-weight:900;font-size:13px}.prodsub{font-size:10px;color:var(--muted);margin-top:3px}.editgrid{display:grid;grid-template-columns:1fr 90px 100px;gap:7px;align-items:end;margin-top:9px}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.field input{width:100%;padding:8px;border:1px solid #cbd4cc;border-radius:8px;background:#fff}.lineprice{font-size:13px;font-weight:900;text-align:right;padding-bottom:8px}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;font-size:11px;font-weight:900;cursor:pointer}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.green{background:var(--green);color:#fff;border-color:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}.totalrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:950}.totalrow strong{font-size:20px}.checkrow{display:flex;align-items:flex-start;gap:9px;padding:12px;background:var(--greenbg);border-radius:10px;margin-top:12px}.checkrow input{margin-top:3px;width:18px;height:18px;accent-color:var(--green)}.checkrow b{font-size:12px;color:var(--green)}.checkrow small{display:block;color:#4d705a;font-size:10px;margin-top:3px}.notice{padding:10px;border-radius:10px;background:var(--soft);font-size:11px;color:var(--muted);margin:9px 0}.backtop{display:flex;gap:7px;align-items:center;color:var(--green);font-size:11px;font-weight:900;cursor:pointer;margin:4px 0 12px}.footnote{text-align:center;color:var(--muted);font-size:10px;padding:20px 0}.hide{display:none!important}@media(max-width:420px){.editgrid{grid-template-columns:1fr 76px 86px}.titleline h2{font-size:18px}.stat b{font-size:17px}}
</style></head><body>
<header class="top"><div class="wrap"><h1>Оператива доставе</h1><p>Преглед туре · пунктови · купци · поруџбине</p></div></header>
<div class="tourbar"><div class="wrap tourbarin"><div><b>Тура #68 · 8. новембар</b><div class="muted">Возач: Јовица · демонстрациони приказ</div></div><span class="pill amber">У току</span></div></div>
<main class="wrap screen"><nav class="crumb" id="crumb"></nav><div id="view"></div><div class="footnote">Ово је интерактивни прототип са пробним подацима. Измене се чувају само у приказу док је страница отворена.</div></main>
<script>
const data=[
{id:1,name:"Крњево — центар",time:"08:30",address:"Код задруге",people:[
{id:11,name:"Александра Владе Дивљан",phone:"063 111 22 33",status:"pending",items:[{name:"Млеко 1,5 л",pack:"флаша",qty:2,price:300,picked:2},{name:"Јаја",pack:"10 ком",qty:1,price:250,picked:1}]},
{id:12,name:"Милица Петровић",phone:"064 222 33 44",status:"pending",items:[{name:"Козји сир",pack:"кг",qty:1.5,price:1200,picked:1.5},{name:"Сурутка",pack:"1 л",qty:2,price:180,picked:2}]},
{id:13,name:"Ненад Јовановић",phone:"065 333 44 55",status:"done",items:[{name:"Домаћа јаја",pack:"10 ком",qty:2,price:250,picked:2}]}
]},
{id:2,name:"Велика Плана — пијаца",time:"09:15",address:"Главни улаз на пијацу",people:[
{id:21,name:"Славица Марковић",phone:"063 444 55 66",status:"pending",items:[{name:"Козји сир",pack:"кг",qty:2,price:1200,picked:2},{name:"Сурутка",pack:"л",qty:3,price:180,picked:2}]},
{id:22,name:"Драган Илић",phone:"064 555 66 77",status:"pending",items:[{name:"Млеко 1,5 л",pack:"флаша",qty:4,price:300,picked:3},{name:"Маслине",pack:"паковање",qty:1,price:450,picked:0}]}
]},
{id:3,name:"Лозовик — школа",time:"10:00",address:"Паркинг испред школе",people:[
{id:31,name:"Јелена Николић",phone:"062 666 77 88",status:"pending",items:[{name:"Јаја",pack:"10 ком",qty:3,price:250,picked:3}]}
]}
];
let pointId=null,personId=null;
const money=n=>Math.round(n).toLocaleString("sr-RS")+" дин.";
const allPeople=()=>data.flatMap(p=>p.people);
const person=()=>allPeople().find(x=>x.id===personId);
const point=()=>data.find(x=>x.id===pointId);
const total=p=>p.items.reduce((s,x)=>s+x.qty*x.price,0);
function goPoint(id){pointId=id;personId=null;render()}
function goPerson(id){personId=id;render()}
function crumb(){let h='<button onclick="home()">Тура #68</button>';if(pointId){h+=' <span>›</span> <button onclick="goPoint('+pointId+')">'+point().name+'</button>'}if(personId)h+=' <span>›</span> <strong>'+person().name+'</strong>';document.getElementById('crumb').innerHTML=h}
function home(){pointId=null;personId=null;render()}
function render(){crumb();if(personId)renderOrder();else if(pointId)renderPeople();else renderPoints()}
function renderPoints(){
let people=allPeople(),done=people.filter(p=>p.status==='done').length;
document.getElementById('view').innerHTML=`
<div class="titleline"><div><h2>Пунктови на тури</h2><p>Изабери пункт да видиш распоред и купце.</p></div><span class="pill">3 пункта</span></div>
<div class="stats"><div class="stat"><b>3</b><span>пункта на тури</span></div><div class="stat"><b>${people.length}</b><span>купаца укупно</span></div><div class="stat"><b>${done}/${people.length}</b><span>достављено</span></div></div>
<div class="sectionhead"><b>Редослед обиласка</b><span class="muted">Време доласка</span></div>
${data.map(p=>{let d=p.people.filter(x=>x.status==='done').length;return `<section class="card point" onclick="goPoint(${p.id})"><div class="row"><div><div class="pointname">${p.name}</div><div class="pointmeta">${p.address} · ${p.people.length} купца</div></div><div class="right"><div class="time">${p.time}</div><span class="pill ${d===p.people.length?'green':'amber'}">${d}/${p.people.length} готово</span></div></div><div class="bar"><i style="width:${d/p.people.length*100}%"></i></div></section>`}).join('')}`;
}
function renderPeople(){
let p=point(),done=p.people.filter(x=>x.status==='done').length;
document.getElementById('view').innerHTML=`
<div class="backtop" onclick="home()">← Назад на пунктове</div>
<div class="titleline"><div><h2>${p.name}</h2><p>${p.address} · планирани долазак ${p.time}</p></div><span class="pill ${done===p.people.length?'green':'amber'}">${done}/${p.people.length} достављено</span></div>
<div class="stats"><div class="stat"><b>${p.people.length}</b><span>купаца на пункту</span></div><div class="stat"><b>${p.people.filter(x=>x.status!=='done').length}</b><span>чека испоруку</span></div><div class="stat"><b>${done}</b><span>завршено</span></div></div>
<div class="sectionhead"><b>Списак купаца</b><span class="muted">Отвори поруџбину →</span></div>
${p.people.map(x=>`<section class="card person" onclick="goPerson(${x.id})"><div class="personleft"><div class="avatar">${x.name.split(' ').map(s=>s[0]).slice(0,2).join('')}</div><div><div class="personname">${x.name}</div><div class="personmeta">${x.phone} · ${x.items.length} производа · ${money(total(x))}</div></div></div><div class="right"><span class="pill ${x.status==='done'?'green':'amber'}">${x.status==='done'?'Достављено':'За доставу'}</span><div class="muted" style="margin-top:6px">Отвори ›</div></div></section>`).join('')}`;
}
function renderOrder(){
let p=point(),x=person();
document.getElementById('view').innerHTML=`
<div class="backtop" onclick="goPoint(${p.id})">← Назад на купце пункта</div>
<div class="titleline"><div><h2>${x.name}</h2><p>${p.name} · ${x.phone}</p></div><span class="pill ${x.status==='done'?'green':'amber'}">${x.status==='done'?'Достављено':'За доставу'}</span></div>
<div class="sectionhead"><b>Поруџбина купца</b><span class="muted">Измена количине и доставе</span></div>
<div class="card ordercard"><div class="row"><b style="font-size:12px">Ставке поруџбине</b><span class="muted">${x.items.length} производа</span></div>
${x.items.map((it,i)=>`<div class="product"><div class="row"><div><div class="prodname">${it.name}</div><div class="prodsub">Паковање: ${it.pack} · Наручено ${it.qty} · Преузето од добављача ${it.picked}</div></div><span class="pill ${it.picked>=it.qty?'green':'red'}">${it.picked>=it.qty?'Преузето':'Недостаје'}</span></div><div class="editgrid"><div class="field"><label>Количина за испоруку</label><input type="number" min="0" step="0.5" value="${it.qty}" onchange="changeQty(${i},this.value)"></div><div class="field"><label>Цена по пак.</label><input type="number" min="0" value="${it.price}" onchange="changePrice(${i},this.value)"></div><div class="lineprice" id="line${i}">${money(it.qty*it.price)}</div></div></div>`).join('')}
<div class="totalrow"><span>Укупно за наплату</span><strong>${money(total(x))}</strong></div></div>
<div class="card ordercard"><b style="font-size:13px">Контрола доставе</b><div class="notice">Овде се управља стварном испоруком купцу. Преузимање од добављача и достава купцу су одвојене ствари.</div>
${x.items.map((it,i)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div><b style="font-size:12px">${it.name}</b><div class="muted">За доставу: ${it.qty} ${it.pack}</div></div><div class="field" style="width:95px"><label>Достављено</label><input type="number" min="0" max="${it.qty}" step="0.5" value="${it.delivered||0}" onchange="changeDelivered(${i},this.value)"></div></div>`).join('')}
<label class="checkrow"><input type="checkbox" ${x.status==='done'?'checked':''} onchange="finishOrder(this.checked)"><span><b>Потврди да је цела поруџбина достављена купцу</b><small>Када потврдиш, купац и његова поруџбина прелазе у „Достављено“ на овом пункту.</small></span></label>
<div class="controls"><button class="btn" onclick="resetDelivery()">Поништи потврду</button><button class="btn primary" onclick="goPoint(${p.id})">Назад на списак купаца</button></div></div>`;
}
function changeQty(i,v){let x=person();x.items[i].qty=Math.max(0,Number(v)||0);x.items[i].delivered=Math.min(x.items[i].delivered||0,x.items[i].qty);if(x.status==='done')x.status='pending';renderOrder()}
function changePrice(i,v){person().items[i].price=Math.max(0,Number(v)||0);renderOrder()}
function changeDelivered(i,v){let x=person();x.items[i].delivered=Math.min(x.items[i].qty,Math.max(0,Number(v)||0));}
function finishOrder(yes){let x=person();x.status=yes?'done':'pending';x.items.forEach(it=>it.delivered=yes?it.qty:0);renderOrder()}
function resetDelivery(){finishOrder(false)}
render();
</script></body></html>
