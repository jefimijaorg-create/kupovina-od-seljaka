<!doctype html>
<html lang="sr" class="bg-slate-50"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Списак за туру | Наручи домаће</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{color-scheme:light}body{font-family:Arial,system-ui,sans-serif;color:#18332b;background:#f3f7f5}
button,input,select{font:inherit}input{min-width:0} .card{background:#fff;border:1px solid #dce8e1;border-radius:18px;box-shadow:0 3px 12px #173b2b0a}
.num{font-variant-numeric:tabular-nums}.save{background:#087f5b;color:white}.save:disabled{opacity:.55}
@media print{.no-print{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
</style></head>
<body class="min-h-screen">
<header class="bg-emerald-900 text-white px-4 py-5">
 <div class="max-w-4xl mx-auto"><div class="text-xs tracking-widest text-emerald-200 font-bold">НАРУЧИ ДОМАЋЕ · АДМИНИСТРАЦИЈА</div>
 <h1 class="text-2xl font-black mt-1">Списак за туру</h1><p class="text-sm text-emerald-100 mt-1">Пункт · купац · производ · паковање · количина · цена · укупно</p></div>
</header>
<main class="max-w-4xl mx-auto p-3 sm:p-5">
 <section class="card p-4 mb-4 no-print">
  <label class="block text-sm font-bold mb-2" for="tour">Изабери туру</label>
  <select id="tour" class="w-full border rounded-xl p-3 bg-white" onchange="loadTour(this.value)"><option value="">Учитавање тура…</option></select>
  <div class="flex gap-2 mt-3"><button class="save rounded-xl px-4 py-3 font-bold flex-1" onclick="refresh()">Освежи податке</button><button class="rounded-xl border px-4 py-3 font-bold" onclick="window.print()">Штампај</button></div>
 </section>
 <div id="message" class="text-sm mb-3" role="status">Повезивање са базом…</div>
 <section id="summary" class="grid grid-cols-3 gap-2 mb-4"></section>
 <section class="card p-3 mb-4 no-print">
  <input id="search" type="search" placeholder="Претражи купца, пункт или производ…" class="w-full border rounded-xl p-3" oninput="render()">
  <div id="filters" class="flex flex-wrap gap-2 mt-3"></div>
 </section>
 <div id="list" class="space-y-4"></div>
</main>
<script>
const URL='https://kszkehxrcuagymlfowqj.supabase.co';
const KEY='sb_publishable_TRZp6skXsdIUsE4Vl65_2Q_QskFb532';
const HEAD={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
let tours=[],tourId=null,items=[],orders=[],customers=[],points=[],tourPoints=[],activePoint='all',busy=new Set(),checkedLines=new Set();
const $=id=>document.getElementById(id), num=v=>Number(v||0), fmt=v=>num(v).toLocaleString('sr-RS',{maximumFractionDigits:3}), money=v=>num(v).toLocaleString('sr-RS',{maximumFractionDigits:2})+' дин.';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(URL+'/rest/v1/'+path,{cache:'no-store',...opt,headers:{...HEAD,'Cache-Control':'no-cache',...(opt.headers||{})}});const t=await r.text();if(!r.ok)throw Error('Supabase '+r.status+': '+t.slice(0,500));return t?JSON.parse(t):[]}
function say(t,bad=false){$('message').textContent=t;$('message').className='text-sm mb-3 '+(bad?'text-red-700':'text-emerald-800')}
function getOrder(id){return orders.find(o=>String(o.id)===String(id))||{}}
function getCustomer(id){return customers.find(c=>String(c.id)===String(id))||{}}
function getPoint(id){return points.find(p=>String(p.id)===String(id))||{}}
function pack(x){let count=num(x.package_count)||num(x.broj_pakovanja)||1;let total=num(x.total_quantity)||num(x.kolicina);let size=num(x.package_size);if(!size&&count)size=total/count;let unit=x.package_unit||x.quantity_unit||x.jedinica||'ком';let label=x.variant_name||x.velicina_pakovanja||x.package_info||((fmt(size)+' '+unit));return {count,size,unit,label,total:total||count*size}}
function linePrice(x){const p=pack(x);return p.count?num(x.cena_stavke)/p.count:num(x.unit_price)*p.size}
function pointSort(a,b){const aa=tourPoints.find(x=>String(x.punkt_id)===String(a)),bb=tourPoints.find(x=>String(x.punkt_id)===String(b));const orderA=aa?.redosled!=null?num(aa.redosled):(getPoint(a).sort_order!=null?num(getPoint(a).sort_order):99999);const orderB=bb?.redosled!=null?num(bb.redosled):(getPoint(b).sort_order!=null?num(getPoint(b).sort_order):99999);return orderA-orderB||String(getPoint(a).name).localeCompare(String(getPoint(b).name),'sr')}
function pointTime(id){const tp=tourPoints.find(x=>String(x.punkt_id)===String(id));const raw=tp?.vreme||getPoint(id).vreme||'';return raw?String(raw).slice(0,5):'Време није уписано'}
async function init(){try{say('Учитавање тура…');tours=await api('ture?select=id,naziv,datum,status&order=datum.desc,id.desc&limit=500');$('tour').innerHTML='<option value="">Изабери туру</option>'+tours.map(t=>'<option value="'+t.id+'">'+esc(t.datum||'')+' — '+esc(t.naziv||('Тура '+t.id))+'</option>').join('');const wanted=new URLSearchParams(location.search).get('tura');const initial=tours.find(t=>String(t.id)===wanted)||tours.find(t=>t.datum==='2026-11-15')||tours[0];if(initial){$('tour').value=String(initial.id);await loadTour(initial.id)}else say('У бази нема креираних тура.',true)}catch(e){say('Не могу да учитам туре: '+e.message,true)}}
async function loadTour(id){if(!id)return;tourId=String(id);activePoint='all';checkedLines.clear();say('Учитавање поруџбина за туру…');try{
 const [rows,ord,pts,cust,tp]=await Promise.all([
  api('stavke_porudzbine?select=*&tura_id=eq.'+encodeURIComponent(tourId)+'&order=id.asc'),
  api('porudzbine?select=id,kupac_id,punkt_id,telefon,status,ukupna_cena&limit=5000'),
  api('punktovi?select=id,name,sort_order'),
  api('kupci?select=id,ime_prezime,telefon'),
  api('tura_punktovi?select=tura_id,punkt_id,redosled,vreme,aktivan&tura_id=eq.'+encodeURIComponent(tourId))
 ]);
 items=rows;checkedLines=new Set(rows.filter(x=>x.stavka_cekirana===true).map(x=>String(x.id)));orders=ord;points=pts;customers=cust;tourPoints=tp;
 say('Учитано '+items.length+' ставки. Измене количине и цене чувају се у бази.');
 render();
 }catch(e){say('Грешка при учитавању туре: '+e.message,true)}}
async function refresh(){if(tourId)await loadTour(tourId);else await init()}
function isLineDelivered(x){const p=pack(x);return p.total>0&&num(x.isporucena_kolicina)>=p.total-0.000001}\nfunction render(){
 const pendingItems=items.filter(x=>!isLineDelivered(x));
 const q=$('search').value.trim().toLocaleLowerCase('sr');
 const pointIds=[...new Set(pendingItems.map(x=>String(getOrder(x.porudzbina_id).punkt_id||'')).filter(Boolean))].sort(pointSort);
 $('filters').innerHTML='<button class="rounded-full border px-3 py-2 text-xs font-bold '+(activePoint==='all'?'bg-emerald-900 text-white':'bg-white')+'" onclick="filterPoint(\'all\')">Сви пунктови</button>'+pointIds.map(id=>'<button class="rounded-full border px-3 py-2 text-xs font-bold '+(activePoint===id?'bg-emerald-900 text-white':'bg-white')+'" onclick="filterPoint(\''+id+'\')">'+esc(getPoint(id).name||'Пункт')+'</button>').join('');
 const groups={};pendingItems.forEach(x=>{const o=getOrder(x.porudzbina_id),pid=String(o.punkt_id||'');const c=getCustomer(o.kupac_id);const text=[getPoint(pid).name,c.ime_prezime,x.proizvod,x.variant_name,x.velicina_pakovanja].join(' ').toLocaleLowerCase('sr');if((activePoint!=='all'&&activePoint!==pid)||(q&&!text.includes(q)))return;(groups[pid]||(groups[pid]=[])).push(x)});
 const visible=Object.values(groups).flat(),buyers=new Set(visible.map(x=>String(x.porudzbina_id))).size,total=visible.reduce((s,x)=>s+num(x.cena_stavke),0),checkedItems=pendingItems.filter(x=>checkedLines.has(String(x.id))),checkedTotal=checkedItems.reduce((s,x)=>s+num(x.cena_stavke),0);
 $('summary').className='grid grid-cols-2 sm:grid-cols-3 gap-2 mb-4';$('summary').innerHTML='<div class="col-span-2 sm:col-span-3 rounded-2xl bg-emerald-900 text-white p-5 shadow-lg border-2 border-emerald-700"><div class="flex items-center justify-between gap-3"><div><div class="text-sm sm:text-base font-black tracking-wide">✓ UKUPNO ČEKIRANO</div><div class="text-xs sm:text-sm text-emerald-100 mt-1">Zbir svih čekiranih stavki u celoj turi · '+checkedItems.length+' stavki</div></div><div class="text-3xl sm:text-4xl font-black num text-right">'+money(checkedTotal)+'</div></div><button type="button" onclick="deliverChecked()" '+(checkedItems.length?'':'disabled')+' class="mt-4 w-full rounded-xl px-4 py-4 text-base sm:text-lg font-black '+(checkedItems.length?'bg-white text-emerald-900':'bg-emerald-800/50 text-emerald-100 opacity-70')+'">✓ SAČUVAJ KAO DOSTAVLJENO · '+checkedItems.length+' STAVKI</button></div><div class="card p-3"><div class="text-xl sm:text-2xl font-black num">'+buyers+'</div><div class="text-[10px] text-slate-500 font-bold mt-1">KUPACA</div></div><div class="card p-3"><div class="text-xl sm:text-2xl font-black num">'+visible.length+'</div><div class="text-[10px] text-slate-500 font-bold mt-1">STAVKI U PRIKAZU</div></div><div class="card p-3"><div class="text-xl sm:text-2xl font-black num">'+money(total)+'</div><div class="text-[10px] text-slate-500 font-bold mt-1">UKUPNO U PRIKAZU</div></div>';
 $('list').innerHTML=Object.keys(groups).sort(pointSort).map(pid=>{const rows=groups[pid];const pointTotal=rows.reduce((s,x)=>s+num(x.cena_stavke),0);const byOrder={};rows.forEach(x=>(byOrder[x.porudzbina_id]??=[]).push(x));return '<section class="card overflow-hidden"><div class="bg-emerald-50 border-b border-emerald-100 p-3 flex justify-between gap-2"><div><div class="flex items-center gap-2 flex-wrap"><h2 class="font-black text-lg">'+esc(getPoint(pid).name||'Непознат пункт')+'</h2><span class="rounded-full bg-white border border-emerald-200 px-2 py-1 text-xs font-black text-emerald-800">'+esc(pointTime(pid))+'</span></div><div class="text-xs text-slate-500">'+new Set(rows.map(x=>String(x.porudzbina_id))).size+' купаца</div></div><b class="text-emerald-900 num">'+money(pointTotal)+'</b></div><div class="p-3 space-y-3">'+Object.entries(byOrder).map(([oid,lines])=>{const o=getOrder(oid),c=getCustomer(o.kupac_id);const customerTotal=lines.reduce((sum,line)=>sum+num(line.cena_stavke),0),customerChecked=lines.filter(line=>checkedLines.has(String(line.id))).reduce((sum,line)=>sum+num(line.cena_stavke),0);return '<div class="border rounded-xl p-3"><div class="flex items-start justify-between gap-2 border-b pb-2 mb-1"><div class="font-black">'+esc(c.ime_prezime||'Купац')+'</div><div class="text-right shrink-0"><div class="text-[10px] text-slate-500 font-bold">УКУПНО ЗА КУПЦА</div><div class="font-black text-emerald-800 num">'+money(customerTotal)+'</div><div class="text-[10px] text-slate-500 mt-1">Чекирано: <b class="text-emerald-700">'+money(customerChecked)+'</b></div></div></div>'+lines.map(rowHtml).join('')+'</div>'}).join('')+'</div></section>'}).join('')||'<div class="card p-6 text-center text-slate-500">Нема ставки за изабрани филтер.</div>';
}
function rowHtml(x){const p=pack(x),unitPrice=linePrice(x),disabled=busy.has(String(x.id)),checked=checkedLines.has(String(x.id));return '<div class="border-t first:border-0 py-3"><label class="flex items-center gap-2 mb-2 text-xs font-bold text-emerald-800"><input type="checkbox" class="w-7 h-7 accent-emerald-700" '+(checked?'checked':'')+' onchange="toggleLine('+x.id+',this.checked)"> УРАЧУНАЈ У ДОДАТНИ ЗБИР</label><div class="font-bold text-sm">'+esc(x.proizvod||'Производ')+'</div><div class="text-xs text-slate-500 mt-1">'+esc(p.label)+' · '+fmt(p.size)+' '+esc(p.unit)+' по паковању</div><div class="grid grid-cols-2 gap-2 mt-3"><label class="text-xs text-slate-500 font-bold">КОЛИЧИНА ПАКОВАЊА<input id="qty-'+x.id+'" type="number" min="0" step="1" value="'+fmt(p.count)+'" class="block w-full mt-1 border rounded-xl p-3 text-base text-slate-900 font-bold"></label><label class="text-xs text-slate-500 font-bold">ЦЕНА ПО ПАКОВАЊУ (дин.)<input id="price-'+x.id+'" type="number" min="0" step="0.01" value="'+unitPrice.toFixed(2)+'" class="block w-full mt-1 border rounded-xl p-3 text-base text-slate-900 font-bold"></label></div><div class="flex items-center justify-between gap-2 mt-3"><div><div class="text-[10px] text-slate-500 font-bold">УКУПНА ЦЕНА</div><div id="total-'+x.id+'" class="font-black text-lg text-emerald-800 num">'+money(num(x.cena_stavke))+'</div></div><button class="save rounded-xl px-4 py-3 text-sm font-black" '+(disabled?'disabled':'')+' onclick="saveLine('+x.id+')">'+(disabled?'ЧУВАМ…':'САЧУВАЈ')+'</button></div></div>'}
function filterPoint(id){activePoint=id;render()}
function toggleLine(id,checked){if(checked)checkedLines.add(String(id));else checkedLines.delete(String(id));render()}
async function deliverChecked(){
 const selected=items.filter(x=>checkedLines.has(String(x.id))&&!isLineDelivered(x));
 if(!selected.length){say('Prvo čekiraj stavke koje su stvarno predate kupcima.',true);return}
 if(!confirm('Upisati '+selected.length+' čekiranih stavki kao DOSTAVLJENO? Posle čuvanja nestaće sa ovog spiska.'))return;
 let saved=0;
 say('Уписујем испоруке у базу…');
 try{
  for(const x of selected){
   const p=pack(x),current=Math.max(0,num(x.isporucena_kolicina)),remaining=Math.max(0,p.total-current),available=Math.max(0,num(x.preuzeta_kolicina)-current);
   if(!(remaining>0)) {checkedLines.delete(String(x.id));continue}
   if(available+0.000001<remaining)throw Error('Нема довољно евидентиране преузете робе за '+(x.proizvod||'ставку')+'. Потребно за испоруку: '+fmt(remaining)+', преузето и расположиво: '+fmt(available)+'.');
   const result=await api('stavke_porudzbine?id=eq.'+encodeURIComponent(x.id)+'&tura_id=eq.'+encodeURIComponent(tourId),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({isporucena_kolicina:p.total,stavka_cekirana:false})});
   const row=Array.isArray(result)?result.find(r=>String(r.id)===String(x.id)):null;
   if(!row||Math.abs(num(row.isporucena_kolicina)-p.total)>0.000001||row.stavka_cekirana!==false)throw Error('База није потврдила испоруку ставке '+x.id+'.');
   Object.assign(x,row);checkedLines.delete(String(x.id));saved++;
  }
  render();
  say('Успешно сачувано као достављено: '+saved+' ставки. Испоручене ставке су уклоњене са списка.');
 }catch(e){
  render();
  say('Испорука је делимично сачувана: '+saved+' ставки. '+e.message,true);
 }
}
async function saveLine(id){const x=items.find(a=>String(a.id)===String(id));if(!x)return;const qtyRaw=$('qty-'+id).value,priceRaw=$('price-'+id).value,qty=Number(qtyRaw),unitPrice=Number(priceRaw),p=pack(x);if(qtyRaw===''||!Number.isFinite(qty)||qty<0||!Number.isInteger(qty)){say('Количина мора бити цео број 0 или већи.',true);return}if(priceRaw===''||!Number.isFinite(unitPrice)||unitPrice<0){say('Цена мора бити 0 или већа.',true);return}if(!(p.size>0)){say('Није могуће утврдити величину паковања за ову ставку. Није сачувано.',true);return}
 busy.add(String(id));render();
 try{
  const totalQty=qty*p.size,totalPrice=qty*unitPrice;
  const isChecked=checkedLines.has(String(id));const patch={package_count:qty,broj_pakovanja:qty,package_size:p.size,package_unit:p.unit,package_info:qty+' × '+p.label,velicina_pakovanja:qty+' × '+p.label,total_quantity:totalQty,kolicina:totalQty,unit_price:p.size?unitPrice/p.size:0,cena_stavke:totalPrice,stavka_cekirana:isChecked};
  const saved=await api('stavke_porudzbine?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(patch)});
  if(!Array.isArray(saved)||!saved.some(r=>String(r.id)===String(id)&&num(r.package_count)===qty&&Math.abs(num(r.cena_stavke)-totalPrice)<0.01&&r.stavka_cekirana===isChecked))throw Error('База није потврдила сачуване вредности и чекирање.');
  Object.assign(x,saved.find(r=>String(r.id)===String(id)));
  const orderId=String(x.porudzbina_id),orderRows=await api('stavke_porudzbine?select=cena_stavke,porudzbina_id&porudzbina_id=eq.'+encodeURIComponent(orderId));
  const orderTotal=orderRows.reduce((s,r)=>s+num(r.cena_stavke),0);
  const updated=await api('porudzbine?id=eq.'+encodeURIComponent(orderId),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({ukupna_cena:orderTotal})});
  if(!Array.isArray(updated)||!updated.some(o=>String(o.id)===orderId&&Math.abs(num(o.ukupna_cena)-orderTotal)<0.01))throw Error('Ставка је сачувана, али укупан износ поруџбине није потврђен. Освежи податке.');
  say('Сачувано: '+fmt(qty)+' паковања × '+money(unitPrice)+' = '+money(totalPrice)+'. Укупна цена поруџбине је прерачуната.');
  render();
 }catch(e){say('Измена није у потпуности сачувана: '+e.message,true);await loadTour(tourId)}finally{busy.delete(String(id))}
}
init();
</script></body></html>
