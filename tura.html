<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тура 20.09.2026. | Од села до града</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#f5f1e8}.tour-page{width:min(1050px,92%);margin:0 auto;padding:24px 0 70px}
.tour-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px}
.tour-head h1{margin:0 0 5px;font-size:30px}.tour-head p{margin:0;color:#687067}
.back{color:#496a3f;text-decoration:none;font-weight:700}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}
.stat{background:#fff;border:1px solid #e4ded2;border-radius:14px;padding:14px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:#747970}
.panel{background:#fff;border:1px solid #e4ded2;border-radius:16px;margin-bottom:18px;overflow:hidden}
.panel h2{font-size:18px;margin:0;padding:16px 18px;border-bottom:1px solid #eee8dd}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid #eee8dd;white-space:nowrap}th{font-size:12px;color:#777;background:#faf8f3}tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3e9;color:#496a3f;font-size:11px;font-weight:700}
.loading{padding:25px;color:#777}.error{padding:20px;color:#9a3d32}
@media(max-width:760px){.summary{grid-template-columns:repeat(2,1fr)}.tour-head{align-items:start;flex-direction:column}.tour-head h1{font-size:25px}}
</style>
</head>
<body>
<header class="top">
  <a href="index.html" class="logo">Од села до града</a>
  <a href="index.html#proizvodi" class="cart-link">← Куповина</a>
</header>
<main class="tour-page">
  <div class="tour-head">
    <div><p>Преглед туре</p><h1 id="title">Тура 20.09.2026.</h1><p id="status">Учитавање...</p></div>
    <a class="back" href="index.html">Назад на почетну</a>
  </div>
  <section class="summary" id="summary"></section>
  <section class="panel">
    <h2>Шта је наручено</h2>
    <div id="products" class="loading">Учитавање...</div>
  </section>
  <section class="panel">
    <h2>По купцима</h2>
    <div id="customers" class="loading">Учитавање...</div>
  </section>
</main>
<script>
const URL='https://kszkehxrcuagymlfowqj.supabase.co';
const KEY='sb_publishable_TRZp6skXsdIUsE4Vl65_2Q_QskFb532';
const headers={'apikey':KEY,'Authorization':'Bearer '+KEY};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(path){const r=await fetch(URL+'/rest/v1/'+path,{headers});if(!r.ok)throw new Error(await r.text());return r.json()}
(async()=>{
 try{
  const tours=await api('ture?datum=eq.2026-09-20&select=id,naziv,datum,status');
  if(!tours.length) throw new Error('Тура није пронађена.');
  const tour=tours[0], rows=await api('stavke_porudzbine?tura_id=eq.'+tour.id+'&select=proizvod,total_quantity,quantity_unit,recipient_name,package_count,package_size,package_unit,variant_name,unit_price&order=recipient_name.asc,proizvod.asc');
  document.getElementById('title').textContent=tour.naziv;
  document.getElementById('status').innerHTML='<span class="badge">'+esc(tour.status)+'</span> · '+new Date(tour.datum+'T00:00:00').toLocaleDateString('sr-RS',{day:'2-digit',month:'2-digit',year:'numeric'});
  const totals={};
  rows.forEach(r=>{if(!totals[r.proizvod])totals[r.proizvod]={qty:0,unit:r.quantity_unit};totals[r.proizvod].qty+=Number(r.total_quantity||0)});
  const summary=[
   ['Кравље млеко',totals['Домаће кравље млеко']?.qty||0,'л'],
   ['Козије млеко',totals['Козије млеко']?.qty||0,'л'],
   ['Козија сурутка',totals['Козија сурутка']?.qty||0,'л'],
   ['Сир',Object.entries(totals).filter(([k])=>k.includes('сир')).reduce((a,[,v])=>a+v.qty,0),'кг'],
   ['Јаја',totals['Домаћа јаја']?.qty||0,'ком']
  ];
  document.getElementById('summary').innerHTML=summary.map(x=>'<div class="stat"><b>'+x[1]+' '+x[2]+'</b><span>'+x[0]+'</span></div>').join('');
  const prod=Object.entries(totals).map(([name,v])=>'<tr><td>'+esc(name)+'</td><td><b>'+v.qty+'</b> '+esc(v.unit)+'</td><td>'+rows.filter(r=>r.proizvod===name).length+' купаца/ставки</td></tr>').join('');
  document.getElementById('products').innerHTML='<div class="table-wrap"><table><thead><tr><th>Производ</th><th>Укупно</th><th>Ставке</th></tr></thead><tbody>'+prod+'</tbody></table></div>';
  const cust={}; rows.forEach(r=>{const n=r.recipient_name||'Непознат купац';(cust[n]??=[]).push(r)});
  const ct=Object.entries(cust).map(([n,items])=>'<tr><td><b>'+esc(n)+'</b></td><td>'+items.map(r=>esc(r.proizvod)+' — '+r.total_quantity+' '+esc(r.quantity_unit)).join('<br>')+'</td></tr>').join('');
  document.getElementById('customers').innerHTML='<div class="table-wrap"><table><thead><tr><th>Купац</th><th>Поруџбина</th></tr></thead><tbody>'+ct+'</tbody></table></div>';
 }catch(e){document.getElementById('status').textContent='Грешка';document.getElementById('products').innerHTML='<div class="error">'+esc(e.message)+'</div>';document.getElementById('customers').innerHTML=''}
})();
</script>
</body>
</html>
