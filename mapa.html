<!doctype html>
<html lang="sr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Избор пункта — Куповина од сељака</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head>
<body data-page="map">
<header class="top"><a href="index.html" class="logo">Од села до града</a><a href="index.html" class="back">← Производи</a></header>
<main class="container">
<section class="hero small"><span>КОРАК 2 ОД 3</span><h1>Изабери где преузимаш</h1><p>Прво изабери начин преузимања, а затим пункт који ти највише одговара.</p></section>
<div class="delivery-options">
<button class="delivery active" data-method="punkt"><strong>📍 Пункт</strong><small>Изабери једно од понуђених места.</small></button>
<button class="delivery" data-method="dogovor"><strong>🚗 Успут / по договору</strong><small>Предложи место на нашој рути.</small></button>
</div>
<section class="points-section">
<div class="section-head"><h2>Понуђени пунктови</h2><span id="pointStatus">Учитавање...</span></div>
<p class="hint">Додирни пункт да видиш место на мапи и детаље.</p>
<div id="points" class="points"></div>
<div class="map-wrap"><div id="map" class="map"></div><div id="mapCard" class="map-card hidden"></div></div>
</section>
<div class="bottom-action"><a href="index.html" class="btn secondary">← Производи</a><button id="continue" class="btn primary" disabled>Настави →</button></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script>
</body></html>
